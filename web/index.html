/* FONTS-EMBED-END */
:root{
  --bg:#F2F1F8;
  --ink:#2E2B3A;
  --mute:#DCDAE8;
  --a:#7FD1B9;
  --b:#FF8FA3;
  --go:#FFD166;
  --display:'Jua','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  --body:'Gothic A1','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* 문서 자체는 절대 스크롤되지 않는다 — 화면 전체는 #app(position:fixed) 이 채우고,
   스크롤이 필요한 것은 #menu 안에서만 한다. overflow 를 안 막으면 안드로이드 웹뷰가
   문서용 스크롤바를 그려서 대결 화면 오른쪽에도 회색 막대가 남는다(2026-09-02 S8 확인).
   그 막대는 CSS ::-webkit-scrollbar 로는 안 없어진다 — 웹뷰가 직접 그리는 것이라서다. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--body);
  background:var(--bg);
  color:var(--ink);
  user-select:none;
  touch-action:manipulation;
}
/* vh 를 쓰지 않는다 — 모바일 크롬에서 100vh 는 '주소창이 숨은 큰 뷰포트' 라
   주소창이 보이는 동안 아래가 잘린다. dvh 는 크롬 108+ 라 구형에서 못 쓴다.
   position:fixed + 네 변 고정은 어디서나 '지금 보이는 높이' 에 딱 맞는다. */
#app{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden}
/* 스크롤바를 숨긴다 — 전체화면 게임이라 회색 막대가 화면에 걸치면 그대로 거슬린다.
   2026-09-02 실기기(S8)에서 확인: 스크롤될 것이 없는 '대결' 화면 오른쪽에도 떠 있었다.
   손가락으로 쓸어 넘기는 것은 그대로 된다 — 보이는 막대만 없앤다. */
::-webkit-scrollbar{display:none}

/* ---------- 세로 전용 (2026-09-29 사용자 «쿵짝은 세로모드만») ----------
   앱은 Flutter 가 세로로 묶지만 **웹(사파리·크롬)은 화면 방향을 묶을 수 없다.**
   그래서 폰을 눕히면 게임을 가리고 «세로로 세워 달라» 는 판을 띄운다.
   pointer:coarse = 손가락 기기만. PC 창은 원래 가로라 거기서 막으면 웹에서 아예 못 한다. */
#rotate{display:none}
@media (orientation:landscape) and (pointer:coarse){
  #rotate{display:flex;position:fixed;inset:0;z-index:9999;background:var(--bg);color:var(--ink);
    flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  #rotate .phone{font-size:56px;animation:rot 1.6s ease-in-out infinite}
  #rotate b{font-family:var(--display);font-size:26px;font-weight:400}
  #rotate p{font-size:15px;opacity:.7}
  #app{visibility:hidden}
}
@keyframes rot{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}

/* ---------- 화면 전환 ---------- */
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- 메뉴 ---------- */
/* overflow-x:hidden — 로고가 화면 밖에서 날아오므로 잠그지 않으면 첫 화면이 옆으로 밀린다 */
#menu{padding:5vh 24px 24px;align-items:center;gap:22px;overflow-y:auto;overflow-x:hidden}
/* 두 글자뿐이라 붙이면 한 덩어리로 뭉쳐 보인다. 살짝 띄워 「쿵」「짝」이 각각 읽히게 한다. */
.logo{font-family:var(--display);font-size:52px;letter-spacing:5px}
.logo small{display:block;font-family:var(--body);font-size:13px;font-weight:400;
  letter-spacing:1px;opacity:.55;margin-top:6px}
/* 「쿵」은 왼쪽, 「짝」은 오른쪽에서 **굴러와서** 가운데서 쿵 박는다(70% 지점, 1.6초).
   구르는 느낌은 «움직인 거리만큼 돌린다» 로 낸다 — 오른쪽으로 가면 시계 방향(+),
   왼쪽으로 가면 반시계 방향(−)으로 한 바퀴 반. 속도는 일정하게(linear) 두다가
   가운데서 딱 멈춰야 «박았다» 로 읽힌다. 감속하면 스르르 서서 맥이 빠진다.
   ⚠ 애니메이션은 transform 만 쓴다 — 글자 위치를 바꾸면 매 프레임 글꼴을 다시 그려 폰에서 끊긴다. */
.logo .ku,.logo .jjak{display:inline-block;will-change:transform}
.logo.play .ku{animation:rollL 1.6s linear both}
.logo.play .jjak{animation:rollR 1.6s linear both}
@keyframes rollL{
  0%  {transform:translateX(-62vw) rotate(-540deg);opacity:0}
  8%  {opacity:1}
  20% {transform:translateX(-46vw) rotate(-400deg)}
  40% {transform:translateX(-30vw) rotate(-262deg)}
  55% {transform:translateX(-16vw) rotate(-140deg)}
  70% {transform:translateX(0) rotate(0)}                      /* 쿵! */
  76% {transform:translateX(9px) rotate(6deg) scale(1.1,.9)}
  84% {transform:translateX(-5px) rotate(-3deg) scale(.97,1.03)}
  92% {transform:translateX(3px) rotate(1deg)}
  100%{transform:none}
}
@keyframes rollR{
  0%  {transform:translateX(62vw) rotate(540deg);opacity:0}
  8%  {opacity:1}
  20% {transform:translateX(46vw) rotate(400deg)}
  40% {transform:translateX(30vw) rotate(262deg)}
  55% {transform:translateX(16vw) rotate(140deg)}
  70% {transform:translateX(0) rotate(0)}                      /* 짝! */
  76% {transform:translateX(-9px) rotate(-6deg) scale(1.1,.9)}
  84% {transform:translateX(5px) rotate(3deg) scale(.97,1.03)}
  92% {transform:translateX(-3px) rotate(-1deg)}
  100%{transform:none}
}
/* 박는 순간 첫 화면 전체가 짧게 떨린다(0.36초). 점점 작아지며 제자리로 돌아온다.
   ⚠ 끝난 뒤 transform 이 남으면 안 된다 — 남으면 그 안의 position:fixed(음악 단추)가
     화면이 아니라 이 상자를 기준으로 삼는다. 그래서 채우기(fill)를 쓰지 않는다. */
@keyframes hit{
  0%  {transform:translate(0,0)}
  12% {transform:translate(-7px,3px)}
  26% {transform:translate(6px,-3px)}
  40% {transform:translate(-5px,2px)}
  56% {transform:translate(4px,-2px)}
  72% {transform:translate(-2px,1px)}
  86% {transform:translate(1px,0)}
  100%{transform:translate(0,0)}
}
#menu.hit{animation:hit .36s ease-out}
/* 움직임을 줄여 달라고 설정한 사람에게는 그냥 제자리에 둔다 */
@media (prefers-reduced-motion:reduce){
  .logo.play .ku,.logo.play .jjak,#menu.hit{animation:none}
}
/* 배경음악 끄고 켜기 — 첫 화면 오른쪽 위. 메뉴가 길어 스크롤해도 늘 같은 자리에 있게 fixed. */
.musicbtn{
  position:fixed;top:14px;right:14px;z-index:5;
  width:46px;height:46px;padding:0;border:none;border-radius:50%;
  background:#fff;box-shadow:0 2px 0 var(--mute);cursor:pointer;
  display:grid;place-items:center;
}
.musicbtn svg{width:26px;height:26px;display:block}
.musicbtn .wave{transition:opacity .15s ease}
.musicbtn.off .wave{opacity:0}
.musicbtn .slash{display:none}
.musicbtn.off .slash{display:block}
.musicbtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* 소리 안내 말풍선 — 음악 단추 밑. 브라우저는 화면을 한 번 건드려야 소리를 내 준다는 것,
   아이폰은 무음 스위치를 따르니 소리가 안 나면 그것부터 보라는 것을 알려 준다 */
.soundtip{
  position:fixed;top:68px;right:10px;z-index:5;max-width:230px;
  background:var(--ink);color:#fff;font-size:13px;line-height:1.45;
  padding:7px 11px;border-radius:12px;animation:tipin .3s ease-out;
}
.soundtip::before{content:"";position:absolute;top:-6px;right:24px;
  border:6px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.soundtip[hidden]{display:none}
@keyframes tipin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* 대결 화면의 음악 단추 — 각자 자기 기준 오른쪽 아래(홈 단추 반대편).
   반쪽 전체가 버저라 .half 밖(#arena 직속)에 둔다. 홈 단추처럼 흐리게 두어 판을 가리지 않는다 */
.musicbtn.duel{position:absolute;z-index:3;width:42px;height:42px;opacity:.55;touch-action:none}
.musicbtn.duel svg{width:22px;height:22px}
#musicA{top:12px;left:12px;right:auto;transform:rotate(180deg)}
#musicB{bottom:12px;right:12px;top:auto}
.gamelist{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.gamecard{
  display:flex;align-items:center;gap:16px;
  background:#fff;border:none;border-radius:22px;padding:18px 20px;
  font-family:var(--body);font-size:16px;color:var(--ink);text-align:left;
  box-shadow:0 2px 0 var(--mute);cursor:pointer;
  transition:transform .12s ease;
}
.gamecard:active{transform:translateY(2px);box-shadow:none}
.gamecard b{font-family:var(--display);font-size:19px;font-weight:400;display:block}
.gamecard span{font-size:13px;opacity:.6}
.gamecard .chip{
  flex:none;width:46px;height:46px;border-radius:16px;
  display:grid;place-items:center;font-size:22px;
}
/* 랜덤 카드 — 게임 하나가 아니라 «고르지 않기» 라 목록과 살짝 떼어 놓는다.
   난이도 점이 없는 것도 일부러다(게임마다 달라서 하나로 못 적는다). */
/* 무지개빛이 한 바퀴 도는 테두리. «고르지 않기» 라는 것이 목록에서 바로 보여야 한다.
   ⚠ 갤럭시 S8 웹뷰 72 에서도 돌아야 한다 — 그 버전에는 `inset` 단축 속성도
   `@property` 도 없다. 그래서 top/right/bottom/left 를 따로 적고, 각도를
   애니메이션하는 대신 요소 자체를 rotate 시킨다.
   conic-gradient 를 못 읽는 브라우저에는 앞줄의 노란색이 그대로 남는다. */
.gamecard.rand{position:relative;z-index:0;overflow:hidden;background:transparent}
.gamecard.rand::before{
  content:'';position:absolute;z-index:-2;
  top:50%;left:50%;width:132%;height:0;padding-bottom:132%;
  transform:translate(-50%,-50%);
  background:var(--go);
  background:conic-gradient(
    #7FD1B9, #A8E6CF, #FFF7D6, #FFD166, #FF8FA3,
    #F3C6F1, #D6A6E8, #9AC8F5, #CFF3E8, #FFFFFF 93%, #7FD1B9);
  animation:randspin 4.5s linear infinite;
}
/* 가운데를 흰색으로 덮어 가장자리 3px 만 남긴다 = 테두리 */
.gamecard.rand::after{
  content:'';position:absolute;z-index:-1;
  top:3px;right:3px;bottom:3px;left:3px;
  border-radius:19px;background:#fff;
}
@keyframes randspin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to  {transform:translate(-50%,-50%) rotate(360deg)}
}
/* 움직임을 줄여 달라고 설정한 사람에게는 돌리지 않는다 */
@media (prefers-reduced-motion:reduce){.gamecard.rand::before{animation:none}}
.gamecard.rand + .gamecard{margin-top:4px}
/* 난이도는 게임 이름 옆에 붙인다. 오른쪽 끝에 두면 설명 줄의 폭을 뺏어
   "노란불이 켜지면 먼저 탭하세요" 가 두 줄로 넘어간다(360px 폰에서 확인). */
.gamecard .tx{flex:1;min-width:0}
/* 난이도는 점이 아니라 글자로 적는다 — 점 세 개는 '난이도' 라는 맥락이 없으면
   그냥 장식으로 보인다(2026-09-02 사용자 지적). 별표도 안 쓴다: 별은 «평점» 으로
   읽혀서 ★★★ 이 '어려운 게임' 이 아니라 '좋은 게임' 처럼 보인다.
   글자는 해석할 여지가 없고, 색을 못 구분해도 뜻이 그대로 남는다. */
.gamecard .lv{
  display:inline-block;margin-left:9px;vertical-align:3px;
  padding:2px 9px 3px;border-radius:999px;
  font-family:var(--body);font-size:11px;font-weight:700;
  color:var(--ink);white-space:nowrap;
}
.gamecard .lv1{background:var(--a)}    /* 쉬움  = 민트 */
.gamecard .lv2{background:var(--go)}   /* 보통  = 노랑 */
.gamecard .lv3{background:var(--b)}    /* 어려움 = 코랄 */

.gamecard.soon{opacity:.42;pointer-events:none}
.hint{font-size:13px;opacity:.5;text-align:center;line-height:1.7;padding-bottom:20px}

/* ---------- 대결 화면 ---------- */
#arena{flex-direction:column}
.half{
  flex:1;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:var(--bg);transition:background .12s ease;
  /* 🚨 none 이어야 한다 — body 의 manipulation 만으로는 부족하다.
     manipulation 은 «두 손가락 = 핀치 줌» 을 브라우저 몫으로 남겨 두기 때문에,
     두 사람이 동시에 두드리면 브라우저가 제스처로 가로채 연타가 씹힌다.
     대결 화면은 스크롤도 확대도 필요 없으니 전부 앱이 가져간다. */
  touch-action:none;
}
.half.top{transform:rotate(180deg)}
.half[data-go="1"]{background:var(--go)}
/* 차례인 사람 쪽만 자기 색으로 옅게 물들인다 — 판 하나를 함께 보는 게임에서는
   글자만으로는 누구 차례인지 놓쳐 남의 차례에 손대게 된다(2026-09-09 테스터). */
.half[data-turn="1"][data-p="A"]{background:#DFF3EC}
.half[data-turn="1"][data-p="B"]{background:#FFE7EC}
.divider{
  height:3px;background:var(--mute);flex:none;position:relative;z-index:2;
}
.pips{display:flex;gap:7px}
.pip{width:11px;height:11px;border-radius:50%;background:var(--mute);transition:background .2s}
/* 점수가 많으면 점을 줄인다 — 11px 짜리 20개는 360px 폰에서 넘친다
   (20×11 + 19×7 = 353px). 7px/4px 로 줄이면 216px 로 넉넉히 들어온다. */
.pips.many{gap:4px}
.pips.many .pip{width:7px;height:7px}
.half[data-p="A"] .pip.on{background:var(--a)}
.half[data-p="B"] .pip.on{background:var(--b)}
.caption{font-family:var(--display);font-size:20px;letter-spacing:-.5px;min-height:26px}
.ms{font-size:13px;opacity:.55;min-height:18px;font-variant-numeric:tabular-nums}
.face{width:132px;height:132px}
.facewrap:empty,.panel:empty{display:none}

/* 게임별 커스텀 슬롯 */
.panel{display:flex;flex-direction:column;align-items:center;gap:24px}
.word{font-family:var(--display);font-size:52px;letter-spacing:-2px;line-height:1}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.swatch{
  width:58px;height:58px;border:none;border-radius:19px;
  box-shadow:0 3px 0 rgba(0,0,0,.13);cursor:pointer;
  transition:transform .1s ease;
}
.swatch:active{transform:translateY(3px);box-shadow:none}
.swatch:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* ---------- 공용 판 레이아웃 (두 사람이 같은 판을 볼 때) ---------- */
#board{display:none}
#arena.shared #board{
  flex:1;min-height:0;padding:12px;
  border-top:3px solid var(--mute);border-bottom:3px solid var(--mute);
  touch-action:none;          /* .half 와 같은 이유 — 두 손가락을 브라우저에 뺏기지 않는다 */
}
#arena.shared #board.trio{display:flex;flex-direction:column;gap:8px}
#arena.shared #board.trio .cards{
  flex:1;min-height:0;display:grid;
  grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:9px;
}
#arena.shared #board.duo{
  display:flex;flex-direction:column;align-items:center;justify-content:space-around;
}
#arena.shared .divider{display:none}
/* 높이를 고정하지 않는다 — 88px 고정이던 때 내용(133px)이 넘쳐
   위아래로 삐져나와 공용 판을 침범하고 캐릭터가 잘렸다(S8 실기기에서 확인). */
#arena.shared .half{flex:none;gap:6px;padding:8px 0}
/* 보조정보 줄은 비어 있어도 자리를 지킨다. 비면 없애던 때(18px 아끼려고) 초읽기·정답 줄이
   생겼다 없어질 때마다 판 높이가 바뀌어, 누를 때마다 원판이 커졌다 작아졌다 했다(2026-09-12 아이폰). */
#arena.shared .ms{height:22px;line-height:22px}
#arena.shared .face{width:52px;height:52px}
#arena.shared .caption{font-size:18px}
#arena.shared .half[data-locked="1"]{opacity:.38}

/* 원판 카드 — 그림 위치와 각도를 무작위로 흩어 어느 쪽에서 봐도 공평하게 */
/* 지름은 게임이 판을 재서 --disc 로 넣는다(같은 그림 찾기의 fit). min(80vw,33vh) 는 재기 전 기본값.
   flex:none — 판이 모자랄 때 flex 가 높이만 줄여 타원이 되지 않게(2026-09-12 아이폰에서 찌그러졌다) */
.dcard{
  position:relative;flex:none;
  width:var(--disc,min(80vw,33vh));height:var(--disc,min(80vw,33vh));
  background:#fff;border-radius:50%;box-shadow:0 3px 0 var(--mute);
}
.sym{
  position:absolute;left:var(--x);top:var(--y);
  transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s));
  width:15%;height:15%;       /* 원판을 따라 줄어든다 — vmin 이면 원판만 작아져 그림끼리 겹친다 */
  background:none;border:none;padding:0;cursor:pointer;
}
.sym svg{width:100%;height:100%;display:block}
.chip-i{width:21px;height:21px;vertical-align:-5px}
.hint-i{width:19px;height:19px;vertical-align:-4px;opacity:.75;margin:0 2px}
.sym:active{filter:brightness(.8)}
.sym:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}

.card{
  background:#fff;border:none;border-radius:16px;padding:8px;
  box-shadow:0 2px 0 var(--mute);cursor:pointer;
  display:grid;place-items:center;min-width:0;min-height:0;
}
.card svg{width:100%;height:100%;max-height:100%}
.card.sel{box-shadow:0 0 0 4px var(--ink) inset}
.card.good{box-shadow:0 0 0 5px #3FB477 inset}
.card.bad{box-shadow:0 0 0 5px #E8544B inset}
.sym.good{background:#DFF5E8;outline:4px solid #3FB477;border-radius:50%}
.sym.bad{background:#FDE3E1;outline:4px solid #E8544B;border-radius:50%}
.card:disabled{cursor:default}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- 게임 중 나가기 ----------
   반쪽 전체가 버저라, 버튼은 .half 밖(#arena 직속)에 얹어 탭이 섞이지 않게 한다.
   0.7초 눌러야 나가진다 — 대결 중 실수로 눌러 점수가 날아가면 안 되기 때문. */
.homebtn{
  position:absolute;z-index:3;
  width:42px;height:42px;padding:0;border:none;border-radius:50%;
  background:none;cursor:pointer;opacity:.45;
  touch-action:none;-webkit-touch-callout:none;
  transition:opacity .15s ease;
}
.homebtn.holding{opacity:1}
.homebtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.homebtn svg{width:100%;height:100%;display:block}
.homebtn .ring{
  fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:107;stroke-dashoffset:107;   /* 2*pi*17 */
  transition:stroke-dashoffset .16s ease-out;
}
.homebtn.holding .ring{stroke-dashoffset:0;transition:stroke-dashoffset .7s linear}
/* 각자 자기 기준 왼쪽 아래에 오도록 — 위쪽(A)은 화면이 180도 돌아 있다 */
#homeA{top:12px;right:12px;transform:rotate(180deg)}
#homeB{bottom:12px;left:12px}

/* ---------- 게임이 쓰는 보조 버튼 (지금은 삼총사의 «다시 뽑기») ----------
   홈 버튼 바로 옆에 둔다. 판 안에 두면 두 버튼이 다 아래쪽에 몰려서,
   마주 앉은 위쪽 사람에게는 «상대편 자리» 로 보인다(2026-09-10 지적).
   반쪽 전체가 버저라 .half 안에 넣으면 탭이 섞이므로 #arena 직속이다. */
.sidebtn{
  position:absolute;z-index:3;
  font-family:var(--display);font-size:14px;color:var(--ink);
  background:#fff;border:none;border-radius:14px;padding:8px 13px;
  box-shadow:0 2px 0 var(--mute);cursor:pointer;
  touch-action:none;-webkit-touch-callout:none;
  transition:background .15s ease,transform .12s ease,opacity .15s ease;
}
.sidebtn:disabled{opacity:.28;cursor:default;box-shadow:none}
.sidebtn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* 눌러 둔 상태는 «자기 색». 글자도 같이 바뀌므로 색만으로 구분하지 않는다 */
#sideA[data-on="1"]{background:var(--a)}
#sideB[data-on="1"]{background:var(--b)}
/* 각자 자기 기준 홈 버튼 옆으로 — 위쪽(A)은 화면이 180도 돌아 있다 */
#sideA{top:12px;right:62px;transform:rotate(180deg)}
#sideB{bottom:12px;left:62px}
#sideA:active{transform:rotate(180deg) translateY(2px);box-shadow:none}
#sideB:active{transform:translateY(2px);box-shadow:none}

/* ---------- 메뉴: 내기 점수 고르기 ---------- */
/* 누가 쿵이고 누가 짝인지 — 색으로만 묶는다.
   위/아래로 적으면 안 된다: 마주 앉으면 각자 자기 쪽이 '아래'로 보여 서로 반대가 된다. */
.who{display:flex;gap:10px;justify-content:center;margin-top:-14px}

.setting{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}

.seg button:active{transform:translateY(2px);box-shadow:none}

.seg button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.secret{font-family:var(--display);font-size:46px;letter-spacing:-2px}
.topic{font-size:14px;opacity:.6}
.disc{width:118px;height:118px;border-radius:50%}
.bignum{font-family:var(--display);font-size:60px;font-variant-numeric:tabular-nums}
.bomb{width:96px;height:96px}

/* 딱 다섯 — 주사위 눈 배치라 180도 돌려도 개수가 같게 보인다 */
#arena.shared #board.pair2{display:flex;align-items:center;justify-content:center;gap:14px}
.fcard{
  background:#fff;border-radius:20px;box-shadow:0 3px 0 var(--mute);
  width:min(42vw,26vh);height:min(42vw,26vh);padding:9px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
}
.fcard span{display:grid;place-items:center;min-width:0;min-height:0}
.fcard svg{width:100%;height:100%}

/* 다른 색 하나 */
#arena.shared #board.tiles{display:grid;gap:8px}

/* 땅따먹기 — viewBox 가 정사각이라 svg 를 꽉 채우면 알아서 비율이 유지된다.
   CSS min() 을 안 쓴다(크롬 79+ 라 구형 웹뷰에서 선언이 통째로 버려진다). */
#arena.shared #board.land{display:flex;align-items:center;justify-content:center;padding:10px}
#arena.shared #board.land svg{width:100%;height:100%}
.tile{border:none;border-radius:14px;cursor:pointer;min-width:0;min-height:0;padding:0}
.tile.good{box-shadow:0 0 0 5px #3FB477 inset}
.tile.bad{box-shadow:0 0 0 5px #E8544B inset}
.tile:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- 정답 / 오답 피드백 ---------- */
@keyframes shakeA{
  0%,100%{transform:translateX(0)}   15%{transform:translateX(-10px)}
  30%{transform:translateX(10px)}    45%{transform:translateX(-7px)}
  60%{transform:translateX(7px)}     75%{transform:translateX(-3px)}
}
@keyframes shakeB{
  0%,100%{transform:rotate(180deg) translateX(0)}   15%{transform:rotate(180deg) translateX(-10px)}
  30%{transform:rotate(180deg) translateX(10px)}    45%{transform:rotate(180deg) translateX(-7px)}
  60%{transform:rotate(180deg) translateX(7px)}     75%{transform:rotate(180deg) translateX(-3px)}
}
@keyframes wash{from{opacity:.32}to{opacity:0}}
.half.wrong{animation:shakeA .42s ease}
.half.top.wrong{animation:shakeB .42s ease}
.half.wrong::before,.half.right::before{
  content:'';position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:3;
  animation:wash .85s ease-out forwards;
}
.half.wrong::before{background:#E8544B}
.half.right::before{background:#3FB477}

/* 무엇을 눌렀는지 보여주는 작은 조각 */
.chip-c{display:inline-block;width:17px;height:17px;border-radius:6px;vertical-align:-3px}
.ms b{font-weight:700}

/* 결과 ---------- */
#result{align-items:center;justify-content:center;gap:26px;padding:24px}
#result .who{font-family:var(--display);font-size:38px}
#result .score{font-size:16px;opacity:.6;font-variant-numeric:tabular-nums}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{
  font-family:var(--display);font-size:17px;color:var(--ink);
  background:#fff;border:none;border-radius:18px;padding:15px 30px;
  box-shadow:0 2px 0 var(--mute);cursor:pointer;transition:transform .12s ease;
}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 2px 0 #16141f}
.btn:focus-visible,.gamecard:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  .half.wrong,.half.top.wrong{animation:none !important}
  .gamecard:active,.btn:active,.swatch:active{transform:none}
}
</style>

<script>
'use strict';

/* =========================================================
   1. 캐릭터 — 표정이 곧 게임 상태
   ========================================================= */
const MOODS = {
  //        눈                                              입
  calm : ['<path d="M-22-4h13M9-4h13"/>',                    '<path d="M-7 16q7 5 14 0"/>'],
  tense: ['<circle cx="-15" cy="-4" r="3"/><circle cx="15" cy="-4" r="3"/>',
                                                             '<path d="M-8 17h16"/>'],
  alert: ['<circle cx="-15" cy="-5" r="8"/><circle cx="15" cy="-5" r="8"/>',
                                                             '<ellipse cx="0" cy="18" rx="9" ry="7"/>'],
  win  : ['<path d="M-23-2q8-11 15 0M8-2q8-11 15 0"/>',       '<path d="M-11 13q11 12 22 0"/>'],
  lose : ['<path d="M-23 2q8 9 15 0M8 2q8 9 15 0"/>',         '<path d="M-9 21q9-9 18 0"/>'],
  foul : ['<path d="M-21-10l12 12M-9-10l-12 12M9-10l12 12M21-10l-12 12"/>',
                                                             '<path d="M-11 18q5-6 11 0t11 0"/>']
};

function face(mood, color){
  const [eyes, mouth] = MOODS[mood] || MOODS.calm;
  return `<svg class="face" viewBox="-70 -70 140 140" aria-hidden="true">
    <ellipse cx="0" cy="4" rx="54" ry="50" fill="${color}"/>
    <g fill="none" stroke="#2E2B3A" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">${eyes}</g>
    <g fill="#2E2B3A" stroke="#2E2B3A" stroke-width="5"
       stroke-linecap="round" stroke-linejoin="round">${mouth}</g>
  </svg>`;
}

/* =========================================================
   1-2. 소리 — 음원 파일 없이 코드로 만든다 (용량 0)
   ========================================================= */
const Sound = (() => {
  let ac = null;
  function ready(){
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, delay, dur, type, vol){
    const c = ready(), o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + delay;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  return {
    /* 🍎 아이폰 사파리 (2026-09-29 «아이폰 웹에서 음악 소리가 안 들려»)
       ① 무음 스위치는 **따른다**(사용자 1-2) — 대부분의 게임 앱과 같다. 'ambient' 로 두면
          무음일 때 조용하고, 다른 앱 음악을 멈추지 않고 같이 나온다(iOS 17+).
          'playback' 으로 두면 무음을 넘어 들리지만 다른 앱 음악을 끊는다 — 그래서 안 쓴다
       ② 손가락이 닿는 순간(pointerdown)만으로는 오디오가 안 깨어나는 판이 있다 →
          그 자리에서 «아무 소리 없는 한 조각» 을 실제로 틀어 준다 */
    unlock(){
      try {
        if (navigator.audioSession) navigator.audioSession.type = 'ambient';
        const c = ready();
        const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource();
        src.buffer = b; src.connect(c.destination); src.start(0);
      } catch(e){}
    },
    ok(){   // 딩-동 (올라가는 두 음)
      try { tone(880, 0, 0.13, 'sine', .20); tone(1318.5, 0.11, 0.24, 'sine', .18); } catch(e){}
    },
    no(){   // 삐- (낮고 거친 한 음)
      try { tone(170, 0, 0.32, 'square', .13); tone(113, 0.05, 0.30, 'square', .11); } catch(e){}
    },
    tick(){ // 똑 (초읽기)
      try { tone(1400, 0, 0.028, 'square', .05); } catch(e){}
    },
    ctx(){ try { return ready(); } catch(e){ return null; } }   // 배경음악이 같은 장치를 쓴다
  };
})();

/* =========================================================
   1-3. 배경음악 — 첫 화면은 곡 전체, 대결 중에는 작은 반주
   음원 파일 없이 **코드로 지은 곡**이다(사랑나라와 같은 방식) — 용량이 0 이고
   오프라인에서도 그대로 나오며 남의 음원을 쓰지 않는다.
   이름 그대로 «쿵»(낮은 북, 1·3박)과 «짝»(높은 화음, 2·4박)이 번갈아 뛰는
   폴카 걸음 위에 다섯 음(도·레·미·솔·라) 가락을 얹었다. 8마디가 돌고 돈다.
   ⚠ 브라우저는 사람이 화면을 한 번 건드리기 전에는 소리를 못 낸다 — 첫 탭에 켠다.
   ⚠ 대결 중에는 가락을 빼고 작은 반주만 깐다(2026-09-29). 게임 소리(딩동·삐·초읽기)와 겹치면 둘 다 안 들린다.
     점수가 나면 짧은 멜로디(jingle), 승부가 나면 조금 긴 것. 결과 화면은 조용하다.
   ========================================================= */
const Music = (() => {
  const STEP = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
  const hz = n => 440 * Math.pow(2, (STEP[n[0]] + (+n.slice(1) + 1) * 12 - 69) / 12);

  const TEMPO = 120, BEAT = 60 / TEMPO, LOOP = 32;      // 8마디 × 4박 (9/20 116→132 «경쾌하게» → 120 «조금 천천히»)
  const BARS  = ['C','G','C','G','F','C','G','C'];      // 마디마다 화음
  const BASS  = { C:'C2', F:'F2', G:'G2' };             // 쿵 — 1·3박
  const CHORD = { C:['C4','E4','G4'], F:['C4','F4','A4'], G:['B3','D4','G4'] };  // 짝 — 2·4박
  /* 가락 [음, 시작하는 박, 길이(박)] — 8분음표로 통통 튀게 */
  const MEL = [
    ['C5',0,.5],['E5',.5,.5],['G5',1,.5],['E5',1.5,.5],['C5',2,.5],['D5',2.5,.5],['E5',3,1],
    ['D5',4,.5],['C5',4.5,.5],['A4',5,.5],['C5',5.5,.5],['G4',6,1],['G4',7,.5],['A4',7.5,.5],
    ['C5',8,.5],['D5',8.5,.5],['E5',9,.5],['G5',9.5,.5],['A5',10,1],['G5',11,1],
    ['E5',12,.5],['D5',12.5,.5],['C5',13,.5],['D5',13.5,.5],['E5',14,1],['D5',15,.5],['C5',15.5,.5],
    ['F5',16,.5],['A5',16.5,.5],['F5',17,.5],['C5',17.5,.5],['A4',18,1],['C5',19,1],
    ['E5',20,.5],['G5',20.5,.5],['E5',21,.5],['C5',21.5,.5],['D5',22,1],['E5',23,1],
    ['G5',24,.5],['A5',24.5,.5],['G5',25,.5],['E5',25.5,.5],['D5',26,1],['G4',27,1],
    ['C5',28,.5],['E5',28.5,.5],['G5',29,.5],['C6',29.5,.5],['G5',30,1],['C5',31,1]
  ];

  let ac = null, on = true, timer = 0, next = 0, live = [];
  /* 'menu' = 첫 화면 곡 전체 · 'duel' = 대결 중 반주(2026-09-29 사용자 1-1).
     대결 중에는 가락·«찰» 을 빼고 낮은 «쿵» 과 옅은 «짝» 만 작게 깐다 —
     초읽기(똑)·정답(딩동)·오답(삐)이 묻히면 게임이 안 되기 때문이다. */
  let mode = 'menu';

  function voice(f, t, dur, vol, type){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.onended = () => { try { o.disconnect(); g.disconnect(); } catch(_){} };
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.03);
    live.push(o);
    if (live.length > 300) live = live.slice(-150);
  }

  /* 한 바퀴(8마디)를 통째로 예약한다 */
  function cycle(t0){
    if (mode === 'duel'){
      BARS.forEach((ch, bar) => {
        const b = t0 + bar * 4 * BEAT;
        voice(hz(BASS[ch]), b,            BEAT * .5, .07, 'triangle');   // 쿵
        voice(hz(BASS[ch]), b + 2 * BEAT, BEAT * .5, .07, 'triangle');   // 쿵
        [1, 3].forEach(beat => CHORD[ch].forEach(n =>                    // 짝 — 네모파 대신 부드러운 세모파
          voice(hz(n), b + beat * BEAT, BEAT * .3, .018, 'triangle')));
      });
      return;
    }
    BARS.forEach((ch, bar) => {
      const b = t0 + bar * 4 * BEAT;
      voice(hz(BASS[ch]), b,            BEAT * .55, .15, 'triangle');    // 쿵
      voice(hz(BASS[ch]), b + 2 * BEAT, BEAT * .55, .15, 'triangle');    // 쿵
      [1, 3].forEach(beat => CHORD[ch].forEach(n =>                      // 짝
        voice(hz(n), b + beat * BEAT, BEAT * .28, .05, 'square')));
      /* 엇박마다 아주 짧고 높은 «찰» — 폴카가 들썩이게 하는 것은 이 반 박이다 */
      [0, 1, 2, 3].forEach(beat =>
        voice(2600, b + (beat + .5) * BEAT, .022, .018, 'square'));
    });
    /* 가락이 제일 잘 들려야 한다. 그래도 정답·오답 소리(.20)보다는 작게 둔다 —
       게임 소리를 덮으면 안 된다(2026-09-20 «너무 작다» 는 의견으로 두 배 키웠다). */
    MEL.forEach(([n, at, len]) =>
      voice(hz(n), t0 + at * BEAT, len * BEAT * .92, .12, 'triangle'));
  }

  function push(){
    if (!on || !ac) return;
    while (next < ac.currentTime + 1.6){ cycle(next); next += LOOP * BEAT; }
  }

  /* 🚨 아이폰·안드로이드는 사람이 건드리기 전 오디오를 «잠든(suspended)» 상태로 둔다.
     잠든 채로 예약하면 시간이 흐르지 않아, 깨어나는 순간 쌓인 음이 한꺼번에 터진다.
     그래서 깨어난 뒤에 시작한다(사랑나라에서 겪은 것과 같은 자리). */
  function begin(){
    if (!on || timer) return;
    ac = Sound.ctx(); if (!ac) return;
    if (ac.state !== 'running'){
      try { ac.resume(); } catch(_){}
      if (ac.state !== 'running'){
        const kick = () => {
          if (ac.state === 'running'){ ac.removeEventListener('statechange', kick); begin(); }
        };
        ac.addEventListener('statechange', kick);
        return;
      }
    }
    next = ac.currentTime + 0.12;
    push();
    timer = setInterval(push, 400);
  }

  function end(){
    if (timer){ clearInterval(timer); timer = 0; }
    live.forEach(o => { try { o.stop(); } catch(_){} });
    live = [];
  }

  return {
    isOn(){ return on; },
    /** m = 'menu' | 'duel'. 곡이 바뀌면 끊고 새로 건다 */
    start(m = 'menu'){
      if (m !== mode){ end(); mode = m; }
      begin();
    },
    stop: end,
    /* 점수가 났을 때 짧은 멜로디. big = 승부가 끝났을 때(조금 길게).
       정답 «딩동» 바로 뒤에 겹치지 않게 살짝 늦게 낸다 */
    jingle(big){
      if (!on) return;
      ac = ac || Sound.ctx();
      if (!ac || ac.state !== 'running') return;
      const t = ac.currentTime + .38, d = .11;
      const notes = big ? ['C5','E5','G5','C6','G5','C6'] : ['G4','C5','E5'];
      notes.forEach((n, i) => {
        const last = i === notes.length - 1;
        voice(hz(n), t + i * d, last ? (big ? .55 : .32) : d * .9, .09, 'triangle');
      });
      if (big) voice(hz('C3'), t + (notes.length - 1) * d, .5, .12, 'triangle');
    },
    /* 로고가 부딪히는 순간 — 낮은 «쿵» 과 짧은 «짝» 을 겹쳐 한 방 */
    bump(){
      if (!on) return;
      ac = ac || Sound.ctx();
      if (!ac || ac.state !== 'running') return;   // 아직 안 깨운 오디오면 조용히 넘어간다
      const t = ac.currentTime;
      voice(hz('C2'), t,       .30, .22, 'triangle');
      voice(hz('G4'), t + .02, .12, .05, 'square');
      voice(3200,     t + .02, .05, .03, 'square');
    },
    toggle(){
      on = !on;
      if (on) begin(); else end();
      return on;
    }
  };
})();

/* =========================================================
   2. 셸 — 화면·점수·캐릭터를 관리한다
      게임은 아래 GAMES 에 { name, icon, desc, start(ctx) } 로 등록만 하면 된다.
   ========================================================= */
// 첫 화면에서 고르는 내기 점수. 2026-09-02 테스터 의견으로 넓혔다(전에는 1·2·3·5·7·10).
// 한 판이 몇 초~몇 분이라 3점은 너무 빨리 끝난다는 의견이었다.
const LEVEL = { 1:'쉬움', 2:'보통', 3:'어려움' };   // 게임 카드에 붙는 난이도 글자
const WIN_CHOICES = [5, 10, 15, 20];
let winScore = 10;
const COLOR = { A:'var(--a)', B:'var(--b)' };
const HEX   = { A:'#7FD1B9', B:'#FF8FA3' };

const el = s => document.querySelector(s);
const halves = { A: el('.half[data-p="A"]'), B: el('.half[data-p="B"]') };

let score = { A:0, B:0 };
let current = null;   // 현재 게임 모듈
let cleanup = null;   // 현재 게임의 정리 함수

const ctx = {
  /** 캐릭터 표정 변경. mood 를 null 로 주면 캐릭터를 숨긴다 */
  setFace(p, mood){
    halves[p].querySelector('[data-face]').innerHTML = mood ? face(mood, HEX[p]) : '';
  },
  /** 게임별 커스텀 UI 를 넣는 슬롯 */
  setPanel(p, html){
    halves[p].querySelector('[data-panel]').innerHTML = html || '';
  },
  /** 두 사람이 함께 보는 가운데 판. cls 로 판 레이아웃을 고른다 */
  setBoard(html, cls){
    const b = el('#board');
    b.className = cls || '';
    b.innerHTML = html || '';
  },
  board(){ return el('#board'); },
  /** 한쪽 버저를 잠근다 */
  lock(p, on){ halves[p].dataset.locked = on ? '1' : ''; },
  half(p){ return halves[p]; },
  /** 홈 버튼 옆 보조 버튼. label 이 없으면 감춘다 (지금은 삼총사의 «다시 뽑기») */
  setSide(p, label){
    const b = el('#side' + p);
    b.hidden = !label;
    b.textContent = label || '';
    if (!label){ b.dataset.on = ''; b.disabled = false; }
  },
  side(p){ return el('#side' + p); },
  /** 캐릭터 아래 한 줄 문구 */
  setCaption(p, text){ halves[p].querySelector('[data-cap]').textContent = text || ''; },
  /** 작은 보조 정보 (기록·누른 것 표시 등). HTML 허용 */
  setInfo(p, html){ halves[p].querySelector('[data-ms]').innerHTML = html || ''; },
  /** 정답/오답을 소리와 화면으로 동시에 알린다 */
  judge(p, ok){
    ok ? Sound.ok() : Sound.no();
    const h = halves[p];
    h.classList.remove('wrong','right');
    void h.offsetWidth;                    // 애니메이션 재시작
    h.classList.add(ok ? 'right' : 'wrong');
    setTimeout(() => h.classList.remove('wrong','right'), 900);
  },
  /** 배경을 신호색으로 */
  setSignal(on){ ['A','B'].forEach(p => halves[p].dataset.go = on ? '1' : ''); },
  /** 지금 차례인 쪽을 자기 색으로 물들인다. null 이면 양쪽 다 끈다 */
  setTurn(p){ ['A','B'].forEach(q => halves[q].dataset.turn = q === p ? '1' : ''); },
  /** 초읽기용 짧은 소리 */
  tick(){ Sound.tick(); },
  /** 양쪽 동시 적용 헬퍼 */
  both(fn){ ['A','B'].forEach(fn); },
  /** 한 라운드 승자 확정 */
  award(winner){
    score[winner]++;
    drawPips();
    const done = score[winner] >= winScore;
    Music.jingle(done);
    if (done) { setTimeout(() => finish(winner), 1100); return true; }
    // 랜덤 모드에서는 true 를 돌려주어 게임이 다음 판을 스스로 예약하지 않게 한다.
    // 그 자리를 nextRandom 이 대신 가져간다 — 안 그러면 옛 게임의 타이머가 겹쳐 돈다.
    if (randomMode) { randTimer = setTimeout(nextRandom, 1500); return true; }
    return false;
  },
  other(p){ return p === 'A' ? 'B' : 'A'; },
  score(){ return { ...score }; }
};

function drawPips(){
  ['A','B'].forEach(p => {
    const box = halves[p].querySelector('[data-pips]');
    box.classList.toggle('many', winScore > 10);
    box.innerHTML = Array.from({length:winScore},
      (_,i) => `<i class="pip${i < score[p] ? ' on' : ''}"></i>`).join('');
  });
}

/** 첫 화면에서 고른 내기 점수를 반영한다 */
function setWin(n){
  winScore = n;
  el('#winseg').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-pressed', Number(b.dataset.n) === n ? 'true' : 'false'));
  el('#winNum').textContent = n;
  drawPips();
}

/* 랜덤 모드 — 한 점이 날 때마다 다른 게임으로 갈아탄다.
   갈아타기 전에 다음 게임의 이름과 설명을 잠깐 보여 준다. 안 그러면 규칙을
   모르는 판이 갑자기 시작돼 두 사람 다 뭘 해야 할지 모른다. */
let randomMode = false, currentKey = null, randTimer = null;

function nextRandom(){
  stopGame();
  const keys = Object.keys(GAMES).filter(k => k !== currentKey);
  const key  = keys[Math.floor(Math.random() * keys.length)];
  const g    = GAMES[key];
  ctx.setSignal(false);
  ctx.setBoard('');
  // 🚨 공용 판 게임에서 넘어올 때 .shared 를 떼지 않으면 화면이 위로 쏠린다 —
  //    shared 에서는 .half 가 flex:none 이라 내용 높이로 쪼그라드는데
  //    가운데 판은 방금 비워서 display:none 이라 아래가 통째로 빈다.
  el('#arena').classList.remove('shared');
  ctx.setTurn(null);
  ctx.both(p => {
    ctx.lock(p, false); ctx.setPanel(p, '');
    ctx.setFace(p, 'calm'); ctx.setCaption(p, g.icon + ' ' + g.name); ctx.setInfo(p, g.desc);
  });
  randTimer = setTimeout(() => startGame(key, true), 2000);
}

function startRandom(){
  randomMode = true;
  const keys = Object.keys(GAMES);
  startGame(keys[Math.floor(Math.random() * keys.length)]);
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  // 첫 화면은 곡 전체 + 로고, 대결은 작은 반주, 결과 화면은 조용히
  if (id === 'menu'){ Music.start('menu'); flyLogo(); }
  else if (id === 'arena') Music.start('duel');
  else Music.stop();
}

/* 로고를 다시 날려 보낸다. 클래스를 뗐다 붙이는 사이에 한 번 그려 줘야(offsetWidth)
   브라우저가 «같은 애니메이션» 으로 보지 않고 처음부터 다시 돌린다. */
let logoTimer = 0;
function flyLogo(){
  const lg = el('#logo'); if (!lg) return;
  lg.classList.remove('play');
  void lg.offsetWidth;
  lg.classList.add('play');
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => {                     // 70% 지점(1.6초 중) — 박는 순간
    Music.bump();
    const m = el('#menu');
    m.classList.remove('hit');
    void m.offsetWidth;                              // 한 번 그려 줘야 다시 돈다
    m.classList.add('hit');
    setTimeout(() => m.classList.remove('hit'), 420);
  }, 1120);
}

function startGame(key, keepScore){
  Sound.unlock();                       // 사용자 조작 시점에만 오디오가 열린다
  current = GAMES[key];
  currentKey = key;
  if (!keepScore) score = { A:0, B:0 };   // 랜덤 모드에서 게임을 갈아탈 때는 점수를 잇는다
  drawPips();
  ctx.setSignal(false);
  ctx.setBoard('');
  ctx.setTurn(null);
  ctx.both(p => { ctx.setPanel(p, ''); ctx.setInfo(p, ''); ctx.lock(p, false);
                  ctx.setSide(p, null); });
  el('#arena').classList.toggle('shared', current.layout === 'shared');
  show('arena');
  cleanup = current.start(ctx) || null;
}

function stopGame(){
  if (typeof cleanup === 'function') cleanup();
  cleanup = null;
  clearTimeout(randTimer);            // 랜덤 갈아타기 예약이 남아 있으면 메뉴로 나간 뒤에 터진다
  ctx.setSignal(false);
}

function finish(winner){
  stopGame();
  el('#resFace').innerHTML = face('win', HEX[winner]);
  el('#resWho').textContent = (winner === 'A' ? '쿵' : '짝') + ' 승리';
  el('#resScore').textContent = `${score.A} : ${score.B}`;
  show('result');
}

/* =========================================================
   3. 게임 1 — 번쩍
   ========================================================= */
const GAMES = {
  reaction: {
    name: '번쩍',
    icon: '⚡',
    desc: '노란불이 켜지면 먼저 탭하세요',
    level: 1,
    start(ctx){
      let phase = 'idle';      // idle | wait | go | pause
      let goAt = 0, plannedGo = 0;
      let timer = null;

      function round(){
        phase = 'wait';
        ctx.setSignal(false);
        ctx.both(p => { ctx.setFace(p,'tense'); ctx.setCaption(p,'기다려'); ctx.setInfo(p,''); });
        const delay = 1500 + Math.random() * 3000;
        plannedGo = performance.now() + delay;
        timer = setTimeout(() => {
          phase = 'go';
          goAt = performance.now();
          ctx.setSignal(true);
          ctx.both(p => { ctx.setFace(p,'alert'); ctx.setCaption(p,'지금!'); });
        }, delay);
      }

      function tap(p){
        const o = ctx.other(p);

        if (phase === 'wait'){                       // 반칙 — 신호 전에 눌렀다
          clearTimeout(timer);
          phase = 'pause';
          const early = ((plannedGo - performance.now()) / 1000).toFixed(1);
          ctx.judge(p, false);
          ctx.setFace(p,'foul'); ctx.setCaption(p,'너무 빨라');
          ctx.setInfo(p, `신호보다 <b>${early}초</b> 먼저 눌렀다`);
          ctx.setFace(o,'win');  ctx.setCaption(o,'한 점');
          ctx.setInfo(o, `상대가 <b>${early}초</b> 먼저 눌렀다`);
          next(ctx.award(o));

        } else if (phase === 'go'){                  // 성공
          const ms = Math.round(performance.now() - goAt);
          phase = 'pause';
          ctx.setSignal(false);
          ctx.judge(p, true);
          ctx.setFace(p,'win');  ctx.setCaption(p,'한 점');  ctx.setInfo(p, `<b>${ms}</b>ms`);
          ctx.setFace(o,'lose'); ctx.setCaption(o,'놓쳤다'); ctx.setInfo(o, `상대 <b>${ms}</b>ms`);
          next(ctx.award(p));
        }
      }

      function next(gameOver){
        if (gameOver) { phase = 'end'; return; }
        timer = setTimeout(round, 1300);
      }

      const handlers = {};
      ['A','B'].forEach(p => {
        handlers[p] = e => { e.preventDefault(); tap(p); };
        halves[p].addEventListener('pointerdown', handlers[p]);
      });

      // 시작 안내
      ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,'준비'); ctx.setInfo(p,''); });
      timer = setTimeout(round, 1200);

      return function stop(){
        clearTimeout(timer);
        ['A','B'].forEach(p => halves[p].removeEventListener('pointerdown', handlers[p]));
      };
    }
  }
};

/* =========================================================
   3-2. 게임 2 — 색깔 함정
   ========================================================= */
const PALETTE = [
  { key:'red',    label:'빨강', hex:'#E8544B' },
  { key:'blue',   label:'파랑', hex:'#4B8BE8' },
  { key:'green',  label:'초록', hex:'#3FB477' },
  { key:'yellow', label:'노랑', hex:'#F2B705' }
];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => arr.map(v => [Math.random(), v])
                          .sort((x, y) => x[0] - y[0]).map(v => v[1]);

GAMES.stroop = {
  name: '색깔 함정',
  icon: '🎨',
  desc: '글자 말고 글자 색을 맞히세요',
  level: 2,
  start(ctx){
    let answer = null, live = false, timer = null;

    function deal(){
      const ink = pick(PALETTE);
      let word = pick(PALETTE);
      while (word.key === ink.key) word = pick(PALETTE);
      answer = ink.key;

      // 두 사람에게 같은 배치를 준다 (버튼 순서가 다르면 불공평)
      const swatches = shuffle(PALETTE).map(c =>
        `<button class="swatch" data-key="${c.key}" style="background:${c.hex}"
                 aria-label="${c.label}"></button>`).join('');

      const html = `<div class="word" style="color:${ink.hex}">${word.label}</div>
                    <div class="swatches">${swatches}</div>`;

      live = true;
      ctx.both(p => {
        ctx.setFace(p, null);
        ctx.setPanel(p, html);
        ctx.setCaption(p, '글자 색은?');
        ctx.setInfo(p, '');
      });
    }

    function answered(p, key){
      if (!live) return;
      live = false;
      const o = ctx.other(p);
      const ok = key === answer;
      ctx.both(q => ctx.setPanel(q, ''));

      const hex = k => PALETTE.find(c => c.key === k).hex;
      const chip = k => `<i class="chip-c" style="background:${hex(k)}"></i>`;
      const shown = `누름 ${chip(key)} · 정답 ${chip(answer)}`;

      ctx.judge(p, ok);
      if (ok){
        ctx.setFace(p,'win');  ctx.setCaption(p,'정답');
        ctx.setFace(o,'lose'); ctx.setCaption(o,'한 발 늦었다');
      } else {
        // 틀려도 상대에게 점수를 주지 않는다 (2026-09-02 테스터 의견)
        ctx.setFace(p,'foul'); ctx.setCaption(p,'글자에 속았다');
        ctx.setFace(o,'calm'); ctx.setCaption(o,'다음 판');
      }
      ctx.both(q => ctx.setInfo(q, shown));   // 양쪽 다 확인할 수 있게
      next(ok ? ctx.award(p) : false);
    }

    function next(gameOver){
      if (gameOver) return;
      timer = setTimeout(deal, 1300);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => {
        const btn = e.target.closest('.swatch');
        if (!btn) return;
        e.preventDefault();
        answered(p, btn.dataset.key);
      };
      halves[p].addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,'준비'); ctx.setInfo(p,''); });
    timer = setTimeout(deal, 1200);

    return function stop(){
      clearTimeout(timer);
      ['A','B'].forEach(p => {
        halves[p].removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-3. 게임 3 — 삼총사 (공용 판 레이아웃)
   카드 = 개수·모양·색·채우기 네 성질의 조합 81장.
   세 장을 골랐을 때 네 성질이 각각 "모두 같거나 모두 다르면" 성립.
   ========================================================= */
GAMES.trio = {
  name: '삼총사',
  icon: '🔺',
  desc: '네 성질이 다 같거나 다 다른 3장',
  level: 3,
  layout: 'shared',
  start(ctx){
    const INK    = ['#8B7DE8', '#F2994A', '#3DB2C4'];
    const ROWS   = [[50], [35, 65], [20, 50, 80]];   // 개수별 세로 배치
    const SHAPE  = [
      '<ellipse cx="0" cy="0" rx="19" ry="10"/>',
      '<path d="M-19 0 L0 -10 L19 0 L0 10 Z"/>',
      '<path d="M-19 0 L-10 -10 L10 -10 L19 0 L10 10 L-10 10 Z"/>'
    ];
    const LIMIT = 6;   // 버저를 누른 뒤 고를 수 있는 시간(초)

    let deck = [], board = [], sel = [];
    let claimer = null, paused = false, tick = null, left = 0, verdict = null;
    /* 예약한 타이머를 모아 둔다 — 중간에 메뉴로 나가거나(랜덤 모드에서) 게임이
       갈아타면 stop() 이 한꺼번에 끊는다. 안 그러면 사라진 판을 다시 그린다. */
    let timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

    const isTrio = (a,b,c) =>
      ['n','shape','color','fill'].every(k => (a[k] + b[k] + c[k]) % 3 === 0);

    function anyTrio(cards){
      for (let i = 0; i < cards.length - 2; i++)
        for (let j = i + 1; j < cards.length - 1; j++)
          for (let k = j + 1; k < cards.length; k++)
            if (isTrio(cards[i], cards[j], cards[k])) return true;
      return false;
    }

    function dealBoard(){
      do {
        deck = [];
        for (let n = 0; n < 3; n++) for (let s = 0; s < 3; s++)
        for (let c = 0; c < 3; c++) for (let f = 0; f < 3; f++)
          deck.push({ n, shape:s, color:c, fill:f });
        deck = shuffle(deck);
        board = deck.splice(0, 12);
      } while (!anyTrio(board));   // 정답이 없는 판은 다시 깐다
    }

    function cardHTML(c, i){
      const col   = INK[c.color];
      const paint = c.fill === 0 ? `fill="${col}"`
                  : c.fill === 1 ? `fill="url(#st${c.color})"`
                  : 'fill="none"';
      const g = ROWS[c.n].map(y =>
        `<g transform="translate(28 ${y})" ${paint} stroke="${col}" stroke-width="3">
           ${SHAPE[c.shape]}</g>`).join('');
      const mark = !sel.includes(i) ? '' : verdict ? ' sel ' + verdict : ' sel';
      return `<button class="card${mark}" data-i="${i}">
                <svg viewBox="0 0 56 100">${g}</svg></button>`;
    }

    /* 다시 뽑기 — 난이도가 높아 둘 다 못 찾는 판이 나온다(2026-09-09 테스터).
       버튼은 각자 **자기 홈 버튼 옆**에 둔다. 판 안에 두면 둘 다 아래쪽에 몰려서
       위쪽 사람에게는 «상대편 자리» 로 보였다(2026-09-10 지적).

       🔑 **둘 다 눌러야 다시 깐다.** 한쪽이 누르면 자기 색으로 켜지고 글자가
       «기다리는 중» 으로 바뀐다. 나머지 한쪽이 누르는 순간 새 판이 깔린다.
       한 사람이 마음대로 판을 갈아엎지 못하게 하려는 것이다 — 상대는 이미
       답을 찾았는데 판이 사라질 수 있다.
       다시 누르면 꺼진다(마음이 바뀔 수 있다). 아무도 버저를 안 누른 동안에만
       눌리고, 점수와는 무관하다. */
    let agree = { A:false, B:false };

    function renderSides(){
      ['A','B'].forEach(q => {
        const b = ctx.side(q);
        b.dataset.on  = agree[q] ? '1' : '';
        b.disabled    = !!(claimer || paused);
        b.textContent = agree[q] ? '🔄 기다리는 중' : '🔄 다시 뽑기';
      });
    }

    function toggleAgree(q){
      if (claimer || paused) return;
      agree[q] = !agree[q];
      Sound.tick();
      if (agree.A && agree.B){ dealBoard(); open(); return; }
      renderSides();
    }

    const render = () => {
      ctx.setBoard('<div class="cards">' + board.map(cardHTML).join('') + '</div>', 'trio');
      renderSides();
    };

    function open(){
      claimer = null; paused = false; sel = []; verdict = null;
      agree = { A:false, B:false };        // 새 판에서는 합의도 새로
      clearInterval(tick);
      ctx.both(p => {
        ctx.lock(p, false);
        ctx.setFace(p, 'calm'); ctx.setCaption(p, '먼저 누르기'); ctx.setInfo(p, '');
      });
      render();
    }

    function claim(p){
      if (claimer || paused) return;
      claimer = p; sel = []; left = LIMIT;
      agree = { A:false, B:false };        // 버저를 누른 순간 남은 합의는 낡은 것
      const o = ctx.other(p);
      ctx.lock(o, true);
      ctx.setFace(p, 'tense'); ctx.setCaption(p, '세 장 고르기'); ctx.setInfo(p, left + '초');
      ctx.setFace(o, 'calm');  ctx.setCaption(o, '대기');        ctx.setInfo(o, '');
      clearInterval(tick);
      tick = setInterval(() => {
        if (--left <= 0) { timeUp(); return; }
        ctx.setInfo(p, left + '초');
      }, 1000);
      render();
    }

    function tapCard(i){
      if (!claimer || paused) return;
      const at = sel.indexOf(i);
      if (at >= 0) sel.splice(at, 1);
      else if (sel.length < 3) sel.push(i);
      render();
      if (sel.length === 3){
        const [a,b,c] = sel.map(x => board[x]);
        isTrio(a,b,c) ? resolve() : missed('삼총사가 아니야');
      }
    }

    /* 틀려도 상대에게 점수를 주지 않는다 — 제한시간 안에서는 계속 다시 고른다.
       (2026-09-02 테스터 의견. 그전에는 틀리면 상대가 한 점을 가져갔다) */
    function missed(why){
      const p = claimer;
      verdict = 'bad';
      ctx.judge(p, false);
      ctx.setFace(p, 'foul'); ctx.setCaption(p, why);
      render();
      later(() => {
        if (claimer !== p || paused) return;        // 그 사이 시간이 끝났으면 그만
        sel = []; verdict = null;
        ctx.setFace(p, 'tense'); ctx.setCaption(p, '세 장 고르기');
        render();
      }, 800);
    }

    /* 시간이 다 되면 아무도 점수를 얻지 않고 새 판으로 간다. */
    function timeUp(){
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);
      ctx.judge(p, false);
      ctx.setFace(p, 'foul'); ctx.setCaption(p, '시간 초과'); ctx.setInfo(p, '');
      ctx.setFace(o, 'calm'); ctx.setCaption(o, '다음 판');   ctx.setInfo(o, '');
      claimer = null;
      render();
      later(open, 1500);
    }

    function resolve(){                          // 맞혔을 때만 들어온다
      clearInterval(tick);
      paused = true;
      verdict = 'good';
      const p = claimer, o = ctx.other(p);

      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,'찾았다'); ctx.setInfo(p,'');
      ctx.setFace(o,'lose'); ctx.setCaption(o,'아쉽다'); ctx.setInfo(o,'');

      claimer = null;
      render();                                  // 고른 카드가 초록으로 남는다
      if (ctx.award(p)) return;

      later(() => {                              // 교체는 표시가 끝난 뒤에
        [...sel].sort((x,y) => y - x).forEach(i => { if (deck.length) board[i] = deck.pop(); });
        if (!anyTrio(board)) dealBoard();
        open();
      }, 1700);
    }

    const boardEl = ctx.board();
    const onBoard = e => {
      const b = e.target.closest('.card');
      if (!b) return;
      e.preventDefault();
      tapCard(Number(b.dataset.i));
    };
    boardEl.addEventListener('pointerdown', onBoard);

    const handlers = {}, sideHandlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); claim(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);

      ctx.setSide(p, '🔄 다시 뽑기');
      sideHandlers[p] = e => { e.preventDefault(); toggleAgree(p); };
      ctx.side(p).addEventListener('pointerdown', sideHandlers[p]);
    });

    dealBoard();
    open();

    return function stop(){
      clearInterval(tick);
      timers.forEach(clearTimeout); timers = [];
      boardEl.removeEventListener('pointerdown', onBoard);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.side(p).removeEventListener('pointerdown', sideHandlers[p]);
        ctx.setSide(p, null);
        ctx.lock(p, false);
      });
      ctx.setBoard('');
    };
  }
};

GAMES.match = {
  name: '같은 그림 찾기',
  icon: '🔍',
  desc: '두 원판에 겹치는 그림은 딱 하나',
  level: 2,
  layout: 'shared',
  start(ctx){
    const SLOTS = [[50,50],[50,19],[76,37],[68,73],[32,73],[24,37]];
    const LIMIT = 5;
    const glyph = i => `<svg viewBox="0 0 48 48">${ICON[i]}</svg>`;
    const chip  = i => `<svg class="chip-i" viewBox="0 0 48 48">${ICON[i]}</svg>`;

    let cards = [], pair = [], common = null;
    let claimer = null, paused = false, tick = null, left = 0;
    /* 예약한 타이머를 모아 둔다 — 메뉴로 나가거나 랜덤 모드에서 게임이 갈아타면
       stop() 이 한꺼번에 끊는다. 안 그러면 사라진 판을 다시 그린다. */
    let timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

    /* 차수 n(소수)의 사영평면 → n²+n+1 장, 각 장에 n+1 개 */
    function buildCards(n){
      const out = [];
      out.push(Array.from({length:n+1}, (_,k) => k));
      for (let i = 0; i < n; i++)
        out.push([0, ...Array.from({length:n}, (_,j) => (n+1) + n*i + j)]);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          out.push([i+1, ...Array.from({length:n},
            (_,k) => (n+1) + n*k + ((i*k + j) % n))]);
      return out;
    }

    const jit = r => (Math.random() * 2 - 1) * r;

    function discHTML(card){
      const syms = shuffle(card).map((s, idx) => {
        const [x, y] = SLOTS[idx];
        return `<button class="sym" data-s="${s}" style="
          --x:${(x + jit(4)).toFixed(1)}%; --y:${(y + jit(4)).toFixed(1)}%;
          --r:${Math.floor(Math.random()*360)}deg;
          --s:${(0.85 + Math.random()*0.35).toFixed(2)}">${glyph(s)}</button>`;
      }).join('');
      return `<div class="dcard">${syms}</div>`;
    }

    const render = () => ctx.setBoard(pair.map(discHTML).join(''), 'duo');

    function deal(){
      const [a, b] = shuffle(cards).slice(0, 2);
      common = a.find(s => b.includes(s));
      pair = [a, b];
      render();
    }

    function open(){
      claimer = null; paused = false;
      clearInterval(tick);
      ctx.both(p => {
        ctx.lock(p, false);
        ctx.setFace(p,'calm'); ctx.setCaption(p,'먼저 누르기'); ctx.setInfo(p,'');
      });
    }

    function claim(p){
      if (claimer || paused) return;
      claimer = p; left = LIMIT;
      const o = ctx.other(p);
      ctx.lock(o, true);
      ctx.setFace(p,'tense'); ctx.setCaption(p,'그림 탭'); ctx.setInfo(p, left + '초');
      ctx.setFace(o,'calm');  ctx.setCaption(o,'대기');   ctx.setInfo(o,'');
      clearInterval(tick);
      tick = setInterval(() => {
        if (--left <= 0) { timeUp(); return; }
        ctx.setInfo(p, left + '초');
      }, 1000);
    }

    function tapSym(s){
      if (!claimer || paused) return;
      s === common ? resolve(s) : missed(s);
    }

    /* 틀려도 상대에게 점수를 주지 않는다 — 제한시간 안에서는 계속 다시 고른다.
       (2026-09-02 테스터 의견. 그전에는 틀리면 상대가 한 점을 가져갔다) */
    function missed(picked){
      const p = claimer;
      ctx.judge(p, false);
      ctx.setFace(p, 'foul'); ctx.setCaption(p, '그건 아니야');
      ctx.board().querySelectorAll('.sym').forEach(el2 => {
        if (Number(el2.dataset.s) === picked) el2.classList.add('bad');
      });
      later(() => {
        if (claimer !== p || paused) return;         // 그 사이 시간이 끝났으면 그만
        ctx.board().querySelectorAll('.sym.bad').forEach(el2 => el2.classList.remove('bad'));
        ctx.setFace(p, 'tense'); ctx.setCaption(p, '그림 탭');
      }, 800);
    }

    /* 시간이 다 되면 아무도 점수를 얻지 않고 새 판으로 간다. */
    function timeUp(){
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);
      markDiscs(null);
      ctx.judge(p, false);
      ctx.setFace(p,'foul'); ctx.setCaption(p,'시간 초과');
      ctx.setFace(o,'calm'); ctx.setCaption(o,'다음 판');
      ctx.both(q => ctx.setInfo(q, `정답 ${chip(common)}`));
      claimer = null;
      later(() => { deal(); open(); }, 1700);
    }

    /* 원판 위에 정답은 초록, 잘못 누른 것은 빨강으로 남긴다 */
    function markDiscs(picked){
      ctx.board().querySelectorAll('.sym').forEach(b => {
        const s = Number(b.dataset.s);
        if (s === common) b.classList.add('good');
        else if (s === picked) b.classList.add('bad');
      });
    }

    function resolve(picked){                   // 맞혔을 때만 들어온다
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);

      markDiscs(picked);
      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,'찾았다');
      ctx.setFace(o,'lose'); ctx.setCaption(o,'아쉽다');
      ctx.both(q => ctx.setInfo(q, `정답 ${chip(common)}`));

      claimer = null;
      if (ctx.award(p)) return;
      later(() => { deal(); open(); }, 1700);
    }

    const boardEl = ctx.board();
    const onBoard = e => {
      const b = e.target.closest('.sym');
      if (!b) return;
      e.preventDefault();
      tapSym(Number(b.dataset.s));
    };
    boardEl.addEventListener('pointerdown', onBoard);

    /* 원판 지름은 판의 실제 크기를 재서 정한다. CSS 의 min(80vw,33vh) 만 믿던 때,
       아이폰 사파리처럼 vh 가 실제로 보이는 화면보다 크면 두 장이 판에 안 들어가
       원판이 타원으로 찌그러졌다(2026-09-12 테스터). 판 높이는 위아래 띠의 문구
       (초읽기·정답 표시)에 따라 바뀌므로 크기가 바뀔 때마다 다시 잰다. */
    function fit(){
      const cs = getComputedStyle(boardEl);
      const w = boardEl.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const h = boardEl.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
      const d = Math.floor(Math.min(w * 0.8, (h - 10) / 2));
      if (d > 0) boardEl.style.setProperty('--disc', d + 'px');
    }
    const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
    if (ro) ro.observe(boardEl); else window.addEventListener('resize', fit);

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); claim(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    cards = buildCards(5);
    deal();
    open();
    fit();

    return function stop(){
      clearInterval(tick);
      timers.forEach(clearTimeout); timers = [];
      if (ro) ro.disconnect(); else window.removeEventListener('resize', fit);
      boardEl.style.removeProperty('--disc');
      boardEl.removeEventListener('pointerdown', onBoard);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.lock(p, false);
      });
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   3-5. 게임 5 — 딱 다섯 (공용 판)
   카드 두 장의 그림이 같은 종류이고, 개수를 더해 정확히 5일 때만 누른다.
   그림은 주사위 눈 배치라 180도 돌려도 개수가 같게 보인다.
   ========================================================= */
GAMES.five = {
  name: '딱 다섯',
  icon: '🍒',
  desc: '같은 그림, 개수 합이 딱 5일 때만',
  level: 3,
  layout: 'shared',
  start(ctx){
    const FRUIT = [0, 1, 2, 3];        // 사과 · 바나나 · 딸기 · 포도
    const SPOTS = {
      1:[[2,2]], 2:[[1,1],[3,3]], 3:[[1,1],[2,2],[3,3]],
      4:[[1,1],[1,3],[3,1],[3,3]], 5:[[1,1],[1,3],[2,2],[3,1],[3,3]]
    };
    const SHOW = 1700;                 // 한 판이 떠 있는 시간
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

    let hit = false, live = false, timer = null, span = null;

    function cardHTML(f, n){
      const cells = SPOTS[n].map(([r, c]) =>
        '<span style="grid-row:' + r + ';grid-column:' + c + '">' +
        '<svg viewBox="0 0 48 48">' + ICON[f] + '</svg></span>').join('');
      return '<div class="fcard">' + cells + '</div>';
    }

    function deal(){
      let f1, f2, n1, n2;
      const r = Math.random();
      if (r < 0.28){                                    // 정답
        f1 = f2 = pick(FRUIT); n1 = rnd(1, 4); n2 = 5 - n1;
      } else if (r < 0.60){                             // 같은 그림인데 합이 5가 아님
        f1 = f2 = pick(FRUIT);
        do { n1 = rnd(1, 5); n2 = rnd(1, 5); } while (n1 + n2 === 5);
      } else if (r < 0.85){                             // 합은 5인데 그림이 다름 — 함정
        f1 = pick(FRUIT); do { f2 = pick(FRUIT); } while (f2 === f1);
        n1 = rnd(1, 4); n2 = 5 - n1;
      } else {                                          // 둘 다 아님
        f1 = pick(FRUIT); do { f2 = pick(FRUIT); } while (f2 === f1);
        do { n1 = rnd(1, 5); n2 = rnd(1, 5); } while (n1 + n2 === 5);
      }
      hit = (f1 === f2) && (n1 + n2 === 5);
      live = true;
      ctx.setBoard(cardHTML(f1, n1) + cardHTML(f2, n2), 'pair2');

      clearTimeout(span);
      span = setTimeout(() => {
        live = false;
        if (hit) ctx.both(q => ctx.setCaption(q, '방금 다섯이었다'));
        timer = setTimeout(() => {
          if (hit) ctx.both(q => ctx.setCaption(q, '준비'));
          deal();
        }, hit ? 900 : 240);
      }, SHOW);
    }

    function buzz(p){
      if (!live) return;
      live = false;
      clearTimeout(span); clearTimeout(timer);
      const o = ctx.other(p), ok = hit;
      ctx.judge(p, ok);
      if (ok){
        ctx.setFace(p,'win');  ctx.setCaption(p,'딱 다섯');
        ctx.setFace(o,'lose'); ctx.setCaption(o,'한 발 늦었다');
      } else {
        // 틀려도 상대에게 점수를 주지 않는다 (2026-09-02 테스터 의견)
        ctx.setFace(p,'foul'); ctx.setCaption(p,'다섯이 아니야');
        ctx.setFace(o,'calm'); ctx.setCaption(o,'다음 판');
      }
      if (ok && ctx.award(p)) return;
      timer = setTimeout(() => {
        ctx.both(q => { ctx.setFace(q,'calm'); ctx.setCaption(q,'준비'); });
        deal();
      }, 1700);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); buzz(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,'준비'); ctx.setInfo(p,''); });
    timer = setTimeout(deal, 1100);

    return function stop(){
      clearTimeout(timer); clearTimeout(span);
      ['A','B'].forEach(p => ctx.half(p).removeEventListener('pointerdown', handlers[p]));
      ctx.setBoard('');
    };
  }
};

    let timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

      ctx.half(p).addEventListener('pointerdown', handlers[p]);

      ctx.both(q => ctx.setPanel(q, ''));
      ctx.judge(p, false);
      ctx.setFace(p,'foul'); ctx.setCaption(p,'펑!');
      ctx.setFace(o,'win');  ctx.setCaption(o,'한 점');
      if (ctx.award(o)) return;
      timer = setTimeout(round, 1900);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); pass(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,'준비'); ctx.setInfo(p,''); });
    timer = setTimeout(round, 1100);

    return function stop(){
      phase = 'idle';
      clearTimeout(timer); clearTimeout(beat);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-9. 게임 9 — 연타 대결 (분할 레이아웃)
   5초 동안 자기 쪽을 더 많이 두드린 사람이 이긴다.
   ========================================================= */
GAMES.mash = {
  name: '연타 대결',
  icon: '👊',
  desc: '5초 동안 더 많이 두드리기',
  level: 1,
  start(ctx){
    const DUR = 5000;
    let count = { A:0, B:0 }, phase = 'idle';
    let timer = null, beat = null;

    function round(){
      phase = 'ready';
      count = { A:0, B:0 };
      ctx.both(p => { ctx.setFace(p,'tense'); ctx.setPanel(p,''); ctx.setInfo(p,''); });
      let n = 3;
      ctx.both(p => ctx.setCaption(p, String(n)));
      clearInterval(beat);
      beat = setInterval(() => {
        n--;
        if (n > 0) ctx.both(p => ctx.setCaption(p, String(n)));
        else { clearInterval(beat); go(); }
      }, 700);
    }

    function go(){
      phase = 'go';
      ctx.setSignal(true);
      ctx.both(p => {
        ctx.setFace(p, null);
        ctx.setCaption(p, '연타!');
        ctx.setPanel(p, '<div class="bignum" data-n="' + p + '">0</div>');
      });
      clearTimeout(timer);
      timer = setTimeout(done, DUR);
    }

    function hit(p){
      if (phase !== 'go') return;
      count[p]++;
      const box = ctx.half(p).querySelector('[data-n]');
      if (box) box.textContent = count[p];
    }

    function done(){
      phase = 'end';
      ctx.setSignal(false);
      ctx.both(q => ctx.setPanel(q, ''));
      const note = '쿵 <b>' + count.A + '</b> · 짝 <b>' + count.B + '</b>';

      if (count.A === count.B){                       // 비기면 다시 한 판
        ctx.both(q => { ctx.setFace(q,'tense'); ctx.setCaption(q,'비겼다'); ctx.setInfo(q, note); });
        timer = setTimeout(round, 1900);
        return;
      }
      const p = count.A > count.B ? 'A' : 'B', o = ctx.other(p);
      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,'한 점');
      ctx.setFace(o,'lose'); ctx.setCaption(o,'아쉽다');
      ctx.both(q => ctx.setInfo(q, note));
      if (ctx.award(p)) return;
      timer = setTimeout(round, 2100);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); hit(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,'준비'); ctx.setInfo(p,''); });
    timer = setTimeout(round, 1000);

    return function stop(){
      phase = 'idle';
      clearTimeout(timer); clearInterval(beat);
      ctx.setSignal(false);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-10. 게임 10 — 땅따먹기 (공용 판)
   점 4×4 사이에 번갈아 선을 긋는다. 네모의 네 변을 채운 사람이 그 칸을 먹고
   한 번 더 둔다. 칸이 9개(홀수)라 절대 비기지 않는다.
   점 격자는 완전 대칭이라 180도 돌려도 똑같이 보인다 — 공용 판 조건을 그냥 만족한다.
   ========================================================= */
GAMES.land = {
  name: '땅따먹기',
  icon: '🚩',
  desc: '선을 이어 네모를 먹으세요',
  level: 2,
  layout: 'shared',
  start(ctx){
    const N = 4, M = 11, S = 26;            // 점 개수 · 여백 · 간격 (viewBox 100 기준)
    const at = i => M + i * S;

    let h, v, own, turn, over, timer = null;

    function reset(){
      h   = Array.from({length:N},   () => Array(N-1).fill(''));   // 가로선
      v   = Array.from({length:N-1}, () => Array(N).fill(''));     // 세로선
      own = Array.from({length:N-1}, () => Array(N-1).fill(''));   // 칸 주인
      turn = Math.random() < 0.5 ? 'A' : 'B';
      over = false;
      draw();
      say();
    }

    function tally(){
      let a = 0, b = 0, left = 0;
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N-1; c++){
        if      (own[r][c] === 'A') a++;
        else if (own[r][c] === 'B') b++;
        else left++;
      }
      return { A:a, B:b, left:left };
    }

    function draw(){
      const cell = [], line = [], dot = [], hit = [];
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N-1; c++) if (own[r][c])
        cell.push('<rect x="' + at(c) + '" y="' + at(r) + '" width="' + S + '" height="' + S +
                  '" rx="3" fill="' + HEX[own[r][c]] + '" opacity=".45"/>');

      const add = (x1, y1, x2, y2, by, key) => {
        line.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
                  '" stroke="' + (by ? HEX[by] : '#DCDAE8') +
                  '" stroke-width="' + (by ? 3.6 : 1) + '" stroke-linecap="round"/>');
        if (!by)                              // 아직 안 그은 선만 누를 수 있다
          hit.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
                   '" data-k="' + key + '" stroke="rgba(0,0,0,0)" stroke-width="14"' +
                   ' stroke-linecap="round"/>');
      };
      for (let r = 0; r < N;   r++) for (let c = 0; c < N-1; c++) add(at(c), at(r), at(c+1), at(r), h[r][c], 'h' + r + c);
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N;   c++) add(at(c), at(r), at(c), at(r+1), v[r][c], 'v' + r + c);
      for (let r = 0; r < N;   r++) for (let c = 0; c < N;   c++)
        dot.push('<circle cx="' + at(c) + '" cy="' + at(r) + '" r="2.4" fill="#2E2B3A"/>');

      /* 칸 → 선 → 점 → 투명한 터치 영역 순. 터치 영역이 맨 위라야 손가락으로 잘 잡힌다 */
      ctx.setBoard('<svg viewBox="0 0 100 100">' +
                   cell.join('') + line.join('') + dot.join('') + hit.join('') + '</svg>', 'land');
    }

    function say(){
      const o = ctx.other(turn), t = tally();
      ctx.setFace(turn, 'alert');      ctx.setFace(o, 'calm');
      ctx.setCaption(turn, '내 차례');  ctx.setCaption(o, '기다리기');
      /* 🚨 점수는 반드시 양쪽에 같이 적는다. 한쪽을 '' 로 비우면
         `.ms:empty{display:none}` 때문에 그 반쪽만 18px 짧아지고,
         차례가 바뀔 때마다 짧아지는 쪽이 뒤바뀌어 가운데 판이 흔들린다
         (2026-09-09 테스터 지적). */
      ctx.both(q => ctx.setInfo(q, '쿵 <b>' + t.A + '</b> · 짝 <b>' + t.B + '</b>'));
      /* 차례인 쪽 반쪽을 자기 색으로 물들인다 — 글자만으로는 놓쳐서
         남의 차례에 손대는 일이 있었다 */
      ctx.setTurn(turn);
      /* 지금 둘 사람 쪽만 밝게 — 판은 하나뿐이라 누가 누르든 차례인 쪽의 수로 친다 */
      ctx.lock(turn, false); ctx.lock(o, true);
    }

    function closed(r, c){ return h[r][c] && h[r+1][c] && v[r][c] && v[r][c+1]; }

    function play(p, key){
      if (over || p !== turn) return;
      const r = +key.charAt(1), c = +key.charAt(2);
      if (key.charAt(0) === 'h'){ if (h[r][c]) return; h[r][c] = p; }
      else                      { if (v[r][c]) return; v[r][c] = p; }

      let got = 0;
      for (let i = 0; i < N-1; i++) for (let j = 0; j < N-1; j++)
        if (!own[i][j] && closed(i, j)){ own[i][j] = p; got++; }

      if (got) Sound.ok(); else Sound.tick();
      if (!got) turn = ctx.other(p);          // 칸을 먹었으면 한 번 더 둔다
      draw();

      if (tally().left === 0){ end(); return; }
      say();
    }

    function end(){
      over = true;
      const t = tally(), w = t.A > t.B ? 'A' : 'B', o = ctx.other(w);
      const note = '쿵 <b>' + t.A + '</b> · 짝 <b>' + t.B + '</b>';
      ctx.both(q => ctx.lock(q, false));
      ctx.judge(w, true);
      ctx.setFace(w, 'win');  ctx.setCaption(w, '더 많이 먹었다');
      ctx.setFace(o, 'lose'); ctx.setCaption(o, '아쉽다');
      ctx.both(q => ctx.setInfo(q, note));
      ctx.setTurn(null);
      if (ctx.award(w)) return;
      timer = setTimeout(reset, 2400);
    }

    const onDown = e => {
      const t = e.target.closest('[data-k]');
      if (!t) return;
      e.preventDefault();
      play(turn, t.getAttribute('data-k'));   // SVG 의 dataset 은 구형에서 불안하다
    };
    ctx.board().addEventListener('pointerdown', onDown);
    reset();

    return function stop(){
      clearTimeout(timer);
      ctx.board().removeEventListener('pointerdown', onDown);
      ctx.setTurn(null);
      ctx.both(q => { ctx.lock(q, false); ctx.setInfo(q, ''); });
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   4. 초기화
   ========================================================= */
(function init(){
  const list = el('#gamelist');

  /* 맨 위에 랜덤 — 무엇을 할지 정하는 데 시간을 쓰지 않게 한다.
     한 점이 날 때마다 다른 게임으로 갈아탄다(점수는 이어진다). */
  const rb = document.createElement('button');
  rb.className = 'gamecard rand';
  rb.type = 'button';
  rb.innerHTML = '<span class="chip" style="background:var(--go)">🎲</span>' +
                 '<span class="tx"><b>랜덤</b><span>한 점마다 다른 게임으로</span></span>';
  rb.addEventListener('click', startRandom);
  list.appendChild(rb);

  Object.entries(GAMES).forEach(([key, g], i) => {
    const b = document.createElement('button');
    b.className = 'gamecard';
    const lv = g.level || 2;                       // 1 쉬움 · 2 보통 · 3 어려움
    b.innerHTML = `<span class="chip" style="background:var(--${i % 2 ? 'b' : 'a'})">${g.icon}</span>
                   <span class="tx"><b>${g.name}<span class="lv lv${lv}" aria-label="난이도 ${LEVEL[lv]}">${LEVEL[lv]}</span></b>` +
                  `<span>${g.desc}</span></span>`;
    b.addEventListener('click', () => { randomMode = false; startGame(key); });
    list.appendChild(b);
  });
  const seg = el('#winseg');
  WIN_CHOICES.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = n;
    b.dataset.n = n;
    b.addEventListener('click', () => setWin(n));
    seg.appendChild(b);
  });
  /* 첫 화면에서 이름과 색을 묶어 준다. 이게 없으면 게임 중 "쿵 3 · 짝 2" 나
     "쿵 승리" 를 봐도 자기가 어느 쪽인지 알 길이 없다. */
  el('#who').innerHTML = `<span>${face('calm', HEX.A)}쿵</span>` +
                         `<span>${face('calm', HEX.B)}짝</span>`;

  setWin(winScore);
  flyLogo();                     // 앱을 켠 첫 화면에서도 한 번 날아온다

  el('#again').addEventListener('click', () => startGame(
    Object.keys(GAMES).find(k => GAMES[k] === current)
  ));
  el('#toMenu').addEventListener('click', () => { stopGame(); show('menu'); });

  /* 배경음악 — 끄면 그 뒤로 안 켜진다. 기기에 저장하지 않으므로 앱을 껐다 켜면
     다시 켜진 상태로 돌아온다(내기 점수와 같은 규칙). */
  /* 소리 안내 (2026-09-29 사용자 «화면을 건드려야 노래가 나온다고 안내 · 무음 모드를 끄라는 안내»)
     ① 소리가 아직 안 깨어났으면 «화면을 누르면 음악이 나와요»
     ② 깨어난 뒤 아이폰이면 «안 들리면 무음 모드를 꺼 주세요» 를 6초 — 무음 스위치는 코드로 알 수 없어서 늘 한 번 알려 준다
     안드로이드엔 무음 스위치가 없고(음악은 «미디어 음량» 을 따른다) 앱·웹 모두 ②는 아이폰에서만 */
  const tip = el('#soundTip');
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let tipTimer = 0, iosTold = false;
  const tipSay = t => { clearTimeout(tipTimer); tip.textContent = t; tip.hidden = false; };
  const tipHide = () => { clearTimeout(tipTimer); tip.hidden = true; };
  function onAudio(){
    const c = Sound.ctx();
    if (!c || c.state !== 'running') return;
    tipHide();
    if (IOS && !iosTold && Music.isOn()){
      iosTold = true;
      tipSay('🔕 음악이 안 들리면 폰 옆의 무음 모드를 꺼 주세요');
      tipTimer = setTimeout(tipHide, 6000);
    }
  }
  if (Music.isOn()) tipSay('👆 화면을 누르면 음악이 나와요');
  const hookTip = () => {
    const c = Sound.ctx();
    if (c && !c.__tip){ c.__tip = 1; c.addEventListener('statechange', onAudio); }
    onAudio();
  };

  const mbtns = ['#musicBtn', '#musicA', '#musicB'].map(el);
  mbtns.forEach(b => b.addEventListener('click', () => {
    const on = Music.toggle();
    if (!on) tipHide(); else hookTip();
    mbtns.forEach(m => {
      m.classList.toggle('off', !on);
      m.setAttribute('aria-pressed', on ? 'true' : 'false');
      m.setAttribute('aria-label', on ? '배경음악 끄기' : '배경음악 켜기');
    });
  }));
  /* 브라우저는 사람이 한 번 건드리기 전에는 소리를 못 낸다 — 첫 탭에 깨운다. */
  /* 🍎 아이폰은 pointerdown 이 아니라 손을 뗄 때(touchend·click)에만 깨워 주는 판이 있다.
     그래서 셋 다 걸어 두고, 오디오가 정말 «running» 이 된 뒤에야 떼어 낸다.
     (전에는 첫 pointerdown 에 바로 떼어서, 아이폰에서는 끝내 음악이 안 켜졌다) */
  const WAKE_EV = ['pointerdown', 'touchend', 'click'];
  const onScreen = () => el('#menu').classList.contains('on') ? 'menu'
                       : el('#arena').classList.contains('on') ? 'duel' : null;
  const wake = () => {
    Sound.unlock();
    hookTip();
    const m = onScreen(); if (m) Music.start(m);      // 아직 잠들어 있으면 Music 이 깨어나길 기다렸다 시작한다
    const c = Sound.ctx();
    if (c && c.state === 'running')                    // resume 은 비동기라 첫 탭엔 아직일 수 있다 → 다음 탭에 다시 본다
      WAKE_EV.forEach(ev => document.removeEventListener(ev, wake, true));
  };
  WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  /* 다른 앱에 갔다 오면 아이폰이 오디오를 «interrupted» 로 멈춰 둔다 → 돌아오면 다시 깨운다 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const c = Sound.ctx(); if (c && c.state !== 'running') WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  });

  /* 게임 중 나가기 — 0.7초 눌러야 열린다.
     반쪽 전체가 버저라 짧은 탭으로 나가면 실수로 대결이 날아간다.
     포인터를 캡처해 두어야 손이 버튼 밖으로 미끄러져도 취소를 놓치지 않는다. */
  const HOLD_MS = 700;
  ['A','B'].forEach(p => {
    const btn = el('#home' + p);
    let timer = null;
    const cancel = () => {
      clearTimeout(timer); timer = null;
      btn.classList.remove('holding');
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch(_){}
      btn.classList.add('holding');
      timer = setTimeout(() => {
        cancel();
        stopGame();
        show('menu');
      }, HOLD_MS);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev =>
      btn.addEventListener(ev, cancel));
  });

  drawPips();
})();

/* 서비스워커 — 사파리에서 홈 화면에 추가했을 때 오프라인으로 돌게 한다.
   Flutter WebView는 file:// 로 뜨므로 자동으로 건너뛴다. */
/* 설치한 앱(PWA)·전체화면에서는 방향을 세로로 묶어 본다. 안 되는 브라우저는 조용히 넘어가고 위 #rotate 가 맡는다 */
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
