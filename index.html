GAMES.match = {
  get name(){ return T('같은 그림 찾기', 'Spot the Match'); },
  icon: '🔍',
  get desc(){ return T('두 원판에 겹치는 그림은 딱 하나', 'Exactly one picture is on both discs'); },
  level: 2,
  layout: 'shared',
  start(ctx){
    const SLOTS = [[50,50],[50,19],[76,37],[68,73],[32,73],[24,37]];
    const LIMIT = 5;
    const glyph = i => `<svg viewBox="0 0 48 48">${ICON[i]}</svg>`;
    const chip  = i => `<svg class="chip-i" viewBox="0 0 48 48">${ICON[i]}</svg>`;

    let cards = [], pair = [], common = null;
    let claimer = null, paused = false, tick = null, left = 0;
    /* 예약한 타이머를 모아 둔다 — 메뉴로 나가거나 랜덤 모드에서 게임이 갈아타면
       stop() 이 한꺼번에 끊는다. 안 그러면 사라진 판을 다시 그린다. */
    let timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

    /* 차수 n(소수)의 사영평면 → n²+n+1 장, 각 장에 n+1 개 */
    function buildCards(n){
      const out = [];
      out.push(Array.from({length:n+1}, (_,k) => k));
      for (let i = 0; i < n; i++)
        out.push([0, ...Array.from({length:n}, (_,j) => (n+1) + n*i + j)]);
      for (let i = 0; i < n; i++)
        for (let j = 0; j < n; j++)
          out.push([i+1, ...Array.from({length:n},
            (_,k) => (n+1) + n*k + ((i*k + j) % n))]);
      return out;
    }

    const jit = r => (Math.random() * 2 - 1) * r;

    function discHTML(card){
      const syms = shuffle(card).map((s, idx) => {
        const [x, y] = SLOTS[idx];
        return `<button class="sym" data-s="${s}" style="
          --x:${(x + jit(4)).toFixed(1)}%; --y:${(y + jit(4)).toFixed(1)}%;
          --r:${Math.floor(Math.random()*360)}deg;
          --s:${(0.85 + Math.random()*0.35).toFixed(2)}">${glyph(s)}</button>`;
      }).join('');
      return `<div class="dcard">${syms}</div>`;
    }

    const render = () => ctx.setBoard(pair.map(discHTML).join(''), 'duo');

    function deal(){
      const [a, b] = shuffle(cards).slice(0, 2);
      common = a.find(s => b.includes(s));
      pair = [a, b];
      render();
    }

    function open(){
      claimer = null; paused = false;
      clearInterval(tick);
      ctx.both(p => {
        ctx.lock(p, false);
        ctx.setFace(p,'calm'); ctx.setCaption(p,T('먼저 누르기', 'Buzz first')); ctx.setInfo(p,'');
      });
    }

    function claim(p){
      if (claimer || paused) return;
      claimer = p; left = LIMIT;
      const o = ctx.other(p);
      ctx.lock(o, true);
      ctx.setFace(p,'tense'); ctx.setCaption(p,T('그림 탭', 'Tap the picture')); ctx.setInfo(p, left + T('초', 's'));
      ctx.setFace(o,'calm');  ctx.setCaption(o,T('대기', 'Wait'));   ctx.setInfo(o,'');
      clearInterval(tick);
      tick = setInterval(() => {
        if (--left <= 0) { timeUp(); return; }
        ctx.setInfo(p, left + T('초', 's'));
      }, 1000);
    }

    function tapSym(s){
      if (!claimer || paused) return;
      s === common ? resolve(s) : missed(s);
    }

    /* 틀려도 상대에게 점수를 주지 않는다 — 제한시간 안에서는 계속 다시 고른다.
       (2026-09-02 테스터 의견. 그전에는 틀리면 상대가 한 점을 가져갔다) */
    function missed(picked){
      const p = claimer;
      ctx.judge(p, false);
      ctx.setFace(p, 'foul'); ctx.setCaption(p, T('그건 아니야', 'Not that one'));
      ctx.board().querySelectorAll('.sym').forEach(el2 => {
        if (Number(el2.dataset.s) === picked) el2.classList.add('bad');
      });
      later(() => {
        if (claimer !== p || paused) return;         // 그 사이 시간이 끝났으면 그만
        ctx.board().querySelectorAll('.sym.bad').forEach(el2 => el2.classList.remove('bad'));
        ctx.setFace(p, 'tense'); ctx.setCaption(p, T('그림 탭', 'Tap the picture'));
      }, 800);
    }

    /* 시간이 다 되면 아무도 점수를 얻지 않고 새 판으로 간다. */
    function timeUp(){
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);
      markDiscs(null);
      ctx.judge(p, false);
      ctx.setFace(p,'foul'); ctx.setCaption(p,T('시간 초과', 'Time\'s up'));
      ctx.setFace(o,'calm'); ctx.setCaption(o,T('다음 판', 'Next round'));
      ctx.both(q => ctx.setInfo(q, T(`정답 ${chip(common)}`, `Answer ${chip(common)}`)));
      claimer = null;
      later(() => { deal(); open(); }, 1700);
    }

    /* 원판 위에 정답은 초록, 잘못 누른 것은 빨강으로 남긴다 */
    function markDiscs(picked){
      ctx.board().querySelectorAll('.sym').forEach(b => {
        const s = Number(b.dataset.s);
        if (s === common) b.classList.add('good');
        else if (s === picked) b.classList.add('bad');
      });
    }

    function resolve(picked){                   // 맞혔을 때만 들어온다
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);

      markDiscs(picked);
      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,T('찾았다', 'Found it'));
      ctx.setFace(o,'lose'); ctx.setCaption(o,T('아쉽다', 'So close'));
      ctx.both(q => ctx.setInfo(q, T(`정답 ${chip(common)}`, `Answer ${chip(common)}`)));

      claimer = null;
      if (ctx.award(p)) return;
      later(() => { deal(); open(); }, 1700);
    }

    const boardEl = ctx.board();
    const onBoard = e => {
      const b = e.target.closest('.sym');
      if (!b) return;
      e.preventDefault();
      tapSym(Number(b.dataset.s));
    };
    boardEl.addEventListener('pointerdown', onBoard);

    /* 원판 지름은 판의 실제 크기를 재서 정한다. CSS 의 min(80vw,33vh) 만 믿던 때,
       아이폰 사파리처럼 vh 가 실제로 보이는 화면보다 크면 두 장이 판에 안 들어가
       원판이 타원으로 찌그러졌다(2026-09-12 테스터). 판 높이는 위아래 띠의 문구
       (초읽기·정답 표시)에 따라 바뀌므로 크기가 바뀔 때마다 다시 잰다. */
    function fit(){
      const cs = getComputedStyle(boardEl);
      const w = boardEl.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const h = boardEl.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
      const d = Math.floor(Math.min(w * 0.8, (h - 10) / 2));
      if (d > 0) boardEl.style.setProperty('--disc', d + 'px');
    }
    const ro = window.ResizeObserver ? new ResizeObserver(fit) : null;
    if (ro) ro.observe(boardEl); else window.addEventListener('resize', fit);

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); claim(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    cards = buildCards(5);
    deal();
    open();
    fit();

    return function stop(){
      clearInterval(tick);
      timers.forEach(clearTimeout); timers = [];
      if (ro) ro.disconnect(); else window.removeEventListener('resize', fit);
      boardEl.style.removeProperty('--disc');
      boardEl.removeEventListener('pointerdown', onBoard);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.lock(p, false);
      });
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   3-5. 게임 5 — 딱 다섯 (공용 판)
   카드 두 장의 그림이 같은 종류이고, 개수를 더해 정확히 5일 때만 누른다.
   그림은 주사위 눈 배치라 180도 돌려도 개수가 같게 보인다.
   ========================================================= */
GAMES.five = {
  get name(){ return T('딱 다섯', 'Exactly Five'); },
  icon: '🍒',
  get desc(){ return T('같은 그림, 개수 합이 딱 5일 때만', 'Same picture, and the counts add up to 5'); },
  level: 3,
  layout: 'shared',
  start(ctx){
    const FRUIT = [0, 1, 2, 3];        // 사과 · 바나나 · 딸기 · 포도
    const SPOTS = {
      1:[[2,2]], 2:[[1,1],[3,3]], 3:[[1,1],[2,2],[3,3]],
      4:[[1,1],[1,3],[3,1],[3,3]], 5:[[1,1],[1,3],[2,2],[3,1],[3,3]]
    };
    const SHOW = 1700;                 // 한 판이 떠 있는 시간
    const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

    let hit = false, live = false, timer = null, span = null;

    function cardHTML(f, n){
      const cells = SPOTS[n].map(([r, c]) =>
        '<span style="grid-row:' + r + ';grid-column:' + c + '">' +
        '<svg viewBox="0 0 48 48">' + ICON[f] + '</svg></span>').join('');
      return '<div class="fcard">' + cells + '</div>';
    }

    function deal(){
      let f1, f2, n1, n2;
      const r = Math.random();
      if (r < 0.28){                                    // 정답
        f1 = f2 = pick(FRUIT); n1 = rnd(1, 4); n2 = 5 - n1;
      } else if (r < 0.60){                             // 같은 그림인데 합이 5가 아님
        f1 = f2 = pick(FRUIT);
        do { n1 = rnd(1, 5); n2 = rnd(1, 5); } while (n1 + n2 === 5);
      } else if (r < 0.85){                             // 합은 5인데 그림이 다름 — 함정
        f1 = pick(FRUIT); do { f2 = pick(FRUIT); } while (f2 === f1);
        n1 = rnd(1, 4); n2 = 5 - n1;
      } else {                                          // 둘 다 아님
        f1 = pick(FRUIT); do { f2 = pick(FRUIT); } while (f2 === f1);
        do { n1 = rnd(1, 5); n2 = rnd(1, 5); } while (n1 + n2 === 5);
      }
      hit = (f1 === f2) && (n1 + n2 === 5);
      live = true;
      ctx.setBoard(cardHTML(f1, n1) + cardHTML(f2, n2), 'pair2');

      clearTimeout(span);
      span = setTimeout(() => {
        live = false;
        if (hit) ctx.both(q => ctx.setCaption(q, T('방금 다섯이었다', 'That was five')));
        timer = setTimeout(() => {
          if (hit) ctx.both(q => ctx.setCaption(q, T('준비', 'Ready')));
          deal();
        }, hit ? 900 : 240);
      }, SHOW);
    }

    function buzz(p){
      if (!live) return;
      live = false;
      clearTimeout(span); clearTimeout(timer);
      const o = ctx.other(p), ok = hit;
      ctx.judge(p, ok);
      if (ok){
        ctx.setFace(p,'win');  ctx.setCaption(p,T('딱 다섯', 'Five!'));
        ctx.setFace(o,'lose'); ctx.setCaption(o,T('한 발 늦었다', 'Too slow'));
      } else {
        // 틀려도 상대에게 점수를 주지 않는다 (2026-09-02 테스터 의견)
        ctx.setFace(p,'foul'); ctx.setCaption(p,T('다섯이 아니야', 'Not five'));
        ctx.setFace(o,'calm'); ctx.setCaption(o,T('다음 판', 'Next round'));
      }
      if (ok && ctx.award(p)) return;
      timer = setTimeout(() => {
        ctx.both(q => { ctx.setFace(q,'calm'); ctx.setCaption(q,T('준비', 'Ready')); });
        deal();
      }, 1700);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); buzz(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,T('준비', 'Ready')); ctx.setInfo(p,''); });
    timer = setTimeout(deal, 1100);

    return function stop(){
      clearTimeout(timer); clearTimeout(span);
      ['A','B'].forEach(p => ctx.half(p).removeEventListener('pointerdown', handlers[p]));
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   3-6. 게임 6 — 오락가락 (분할 레이아웃)
   눌러야 하는 색이 판마다 바뀐다. 그 색이 아닐 때 손이 나가면 실점.
   '거꾸로 잡기' 였는데 뒤집히는 게 아니라 목표 색이 바뀌는 것이라 이름을 고쳤다(2026-09-02).
   정답/오답 표시(초록·빨강)와 헷갈리지 않도록 파랑·주황을 쓴다.
   ========================================================= */
GAMES.flip = {
  get name(){ return T('오락가락', 'Flip-Flop'); },
  icon: '🔄',
  get desc(){ return T('이번 판에 정한 색만 누르세요', 'Tap only on this round\'s color'); },
  level: 2,
  start(ctx){
    const HUE = {
      blue  : { get label(){ return T('파랑','Blue'); }, hex:'#4B8BE8' },
      orange: { get label(){ return T('주황','Orange'); }, hex:'#F2994A' }
    };
    const KEYS = ['blue', 'orange'];
    const blank = '<div class="disc" style="background:var(--mute)"></div>';

    let target = 'blue', shown = null, phase = 'idle', timer = null;

    function round(){
      phase = 'rule';
      shown = null;
      target = pick(KEYS);
      ctx.both(p => {
        ctx.setFace(p, null);
        ctx.setPanel(p, blank);
        ctx.setCaption(p, T(HUE[target].label + '에 누르기', 'Tap on ' + HUE[target].label));
        ctx.setInfo(p, '');
      });
      timer = setTimeout(cycle, 1900);
    }

    function cycle(){
      phase = 'blank';
      shown = null;
      ctx.both(p => ctx.setPanel(p, blank));
      timer = setTimeout(() => {
        shown = pick(KEYS);
        phase = 'show';
        ctx.both(p => ctx.setPanel(p,
          '<div class="disc" style="background:' + HUE[shown].hex + '"></div>'));
        timer = setTimeout(() => { if (phase === 'show') cycle(); }, 760);
      }, 700 + Math.random() * 1500);
    }

    function tap(p){
      if (phase !== 'show' && phase !== 'blank') return;
      clearTimeout(timer);
      const o = ctx.other(p);
      const ok = (shown === target);
      const note = shown === null
        ? T('아무 색도 없을 때 눌렀다', 'Tapped with no color')
        : T(HUE[shown].label + '을 눌렀다 · 이번엔 ' + HUE[target].label,
            'Tapped ' + HUE[shown].label + ' · This round: ' + HUE[target].label);
      phase = 'pause';
      ctx.both(q => ctx.setPanel(q, ''));
      ctx.judge(p, ok);
      if (ok){
        ctx.setFace(p,'win');  ctx.setCaption(p,T('잡았다', 'Got it'));
        ctx.setFace(o,'lose'); ctx.setCaption(o,T('놓쳤다', 'Missed'));
      } else {
        // 틀려도 상대에게 점수를 주지 않는다 (2026-09-02 테스터 의견)
        ctx.setFace(p,'foul'); ctx.setCaption(p,T('속았다', 'Fooled'));
        ctx.setFace(o,'calm'); ctx.setCaption(o,T('다음 판', 'Next round'));
      }
      ctx.both(q => ctx.setInfo(q, note));
      if (ok && ctx.award(p)) return;
      timer = setTimeout(round, 1800);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); tap(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,T('준비', 'Ready')); ctx.setInfo(p,''); });
    timer = setTimeout(round, 1100);

    return function stop(){
      clearTimeout(timer);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-7. 게임 7 — 다른 색 하나 (공용 판)
   한 칸만 밝기가 미묘하게 다르다. 맞힐수록 칸이 늘고 차이는 줄어든다.
   ========================================================= */
GAMES.odd = {
  get name(){ return T('다른 색 하나', 'Odd One Out'); },
  icon: '🎯',
  get desc(){ return T('한 칸만 색이 미묘하게 다릅니다', 'One tile is a slightly different shade'); },
  level: 2,
  layout: 'shared',
  start(ctx){
    /* [한 줄 칸 수, 밝기 차이(%)] — 맞힐 때마다 한 단계씩 어려워진다 */
    const LEVELS = [[3,14],[3,11],[4,9],[4,7],[5,6],[5,5],[6,4]];
    const LIMIT = 5;

    let odd = 0, level = 0;
    let claimer = null, paused = false, tick = null, left = 0;
    /* 예약한 타이머를 모아 둔다 — 메뉴로 나가거나 랜덤 모드에서 게임이 갈아타면
       stop() 이 한꺼번에 끊는다. 안 그러면 사라진 판을 다시 그린다. */
    let timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };

    function deal(){
      const [n, delta] = LEVELS[Math.min(level, LEVELS.length - 1)];
      const h = Math.floor(Math.random() * 360);
      const s = 46 + Math.floor(Math.random() * 16);
      const l = 58 + Math.floor(Math.random() * 8);
      const dir = Math.random() < 0.5 ? -1 : 1;
      odd = Math.floor(Math.random() * n * n);
      const tiles = Array.from({length: n * n}, (_, i) =>
        '<button class="tile" data-i="' + i + '" style="background:hsl(' + h + ' ' + s + '% ' +
        (i === odd ? l + dir * delta : l) + '%)"></button>').join('');
      ctx.setBoard(tiles, 'tiles');
      const b = ctx.board();
      b.style.gridTemplateColumns = 'repeat(' + n + ',1fr)';
      b.style.gridTemplateRows    = 'repeat(' + n + ',1fr)';
    }

    function open(){
      claimer = null; paused = false;
      clearInterval(tick);
      ctx.both(p => {
        ctx.lock(p, false);
        ctx.setFace(p,'calm'); ctx.setCaption(p,T('먼저 누르기', 'Buzz first')); ctx.setInfo(p,'');
      });
    }

    function claim(p){
      if (claimer || paused) return;
      claimer = p; left = LIMIT;
      const o = ctx.other(p);
      ctx.lock(o, true);
      ctx.setFace(p,'tense'); ctx.setCaption(p,T('칸 고르기', 'Pick a tile')); ctx.setInfo(p, left + T('초', 's'));
      ctx.setFace(o,'calm');  ctx.setCaption(o,T('대기', 'Wait'));      ctx.setInfo(o,'');
      clearInterval(tick);
      tick = setInterval(() => {
        if (--left <= 0) { timeUp(); return; }
        ctx.setInfo(p, left + T('초', 's'));
      }, 1000);
    }

    function mark(picked){
      ctx.board().querySelectorAll('.tile').forEach(b => {
        const i = Number(b.dataset.i);
        if (i === odd) b.classList.add('good');
        else if (i === picked) b.classList.add('bad');
      });
    }

    function resolve(picked){                    // 맞혔을 때만 들어온다
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);
      mark(picked);
      level++;
      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,T('찾았다', 'Found it'));
      ctx.setFace(o,'lose'); ctx.setCaption(o,T('아쉽다', 'So close'));
      ctx.both(q => ctx.setInfo(q, ''));
      claimer = null;
      if (ctx.award(p)) return;
      later(() => { deal(); open(); }, 1600);
    }

    /* 틀려도 상대에게 점수를 주지 않는다 — 제한시간 안에서는 계속 다시 고른다.
       (2026-09-02 테스터 의견. 그전에는 틀리면 상대가 한 점을 가져갔다) */
    function missed(picked){
      const p = claimer;
      ctx.judge(p, false);
      ctx.setFace(p, 'foul'); ctx.setCaption(p, T('그 칸이 아니야', 'Not that tile'));
      const tile = boardEl.querySelector('.tile[data-i="' + picked + '"]');
      if (tile) tile.classList.add('bad');
      later(() => {
        if (claimer !== p || paused) return;        // 그 사이 시간이 끝났으면 그만
        if (tile) tile.classList.remove('bad');
        ctx.setFace(p, 'tense'); ctx.setCaption(p, T('다른 칸 탭', 'Tap another tile'));
      }, 700);
    }

    /* 시간이 다 되면 아무도 점수를 얻지 않고 새 판으로 간다. */
    function timeUp(){
      clearInterval(tick);
      paused = true;
      const p = claimer, o = ctx.other(p);
      mark(null);
      ctx.judge(p, false);
      ctx.setFace(p,'foul'); ctx.setCaption(p,T('시간 초과', 'Time\'s up'));
      ctx.setFace(o,'calm'); ctx.setCaption(o,T('다음 판', 'Next round'));
      ctx.both(q => ctx.setInfo(q, ''));
      claimer = null;
      later(() => { deal(); open(); }, 1600);
    }

    const boardEl = ctx.board();
    const onBoard = e => {
      const b = e.target.closest('.tile');
      if (!b || !claimer) return;
      e.preventDefault();
      const i = Number(b.dataset.i);
      if (paused) return;
      i === odd ? resolve(i) : missed(i);
    };
    boardEl.addEventListener('pointerdown', onBoard);

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); claim(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    deal();
    open();

    return function stop(){
      clearInterval(tick);
      timers.forEach(clearTimeout); timers = [];
      boardEl.removeEventListener('pointerdown', onBoard);
      boardEl.style.gridTemplateColumns = '';
      boardEl.style.gridTemplateRows = '';
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.lock(p, false);
      });
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   3-8. 게임 8 — 폭탄 돌리기 (분할 레이아웃)
   탭해서 상대에게 넘긴다. 터질 때 들고 있는 쪽이 실점.
   받자마자 되넘기지 못하도록 0.35초는 잠긴다.
   ========================================================= */
GAMES.bomb = {
  get name(){ return T('폭탄 돌리기', 'Bomb Relay'); }   // 영어 이름: 「Pass the Bomb」 은 미국 등록 상표(28류 Piatnik)라 바꿨다(2026-10-03 사용자 1-1),
  icon: '💣',
  get desc(){ return T('터지기 전에 상대에게 넘기세요', 'Pass it on before it blows'); },
  level: 1,
  start(ctx){
    const BOMB = '<svg class="bomb" viewBox="0 0 64 64" aria-hidden="true">' +
      '<circle cx="27" cy="39" r="20" fill="#2E2B3A"/>' +
      '<rect x="36" y="14" width="10" height="11" rx="3" transform="rotate(35 41 20)" fill="#2E2B3A"/>' +
      '<path d="M46 15c7-4 10 2 6 6" fill="none" stroke="#A9784F" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="53" cy="14" r="5" fill="#F2C14E"/>' +
      '<ellipse cx="20" cy="32" rx="5" ry="3.4" fill="#4E4A5E" transform="rotate(-25 20 32)"/>' +
      '</svg>';

    let holder = 'A', endAt = 0, armAt = 0, phase = 'idle';
    let timer = null, beat = null;

    function round(){
      phase = 'live';
      holder = Math.random() < 0.5 ? 'A' : 'B';
      const fuse = 4500 + Math.random() * 6500;
      endAt = performance.now() + fuse;
      paint();
      clearTimeout(timer); clearTimeout(beat);
      timer = setTimeout(boom, fuse);
      beat  = setTimeout(pulse, 260);
    }

    function paint(){
      const o = ctx.other(holder);
      armAt = performance.now() + 350;
      ctx.setFace(holder, 'alert'); ctx.setFace(o, 'tense');
      ctx.setPanel(holder, BOMB);   ctx.setPanel(o, '');
      ctx.setCaption(holder, T('탭해서 넘기기', 'Tap to pass')); ctx.setCaption(o, T('기다리기', 'Wait'));
      ctx.both(q => ctx.setInfo(q, ''));
    }

    /* 남은 시간이 짧을수록 초읽기가 빨라진다 */
    function pulse(){
      if (phase !== 'live') return;
      ctx.tick();
      const ms = endAt - performance.now();
      beat = setTimeout(pulse, ms < 1500 ? 110 : ms < 3000 ? 180 : 270);
    }

    function pass(p){
      if (phase !== 'live' || p !== holder || performance.now() < armAt) return;
      holder = ctx.other(p);
      paint();
    }

    function boom(){
      phase = 'boom';
      clearTimeout(beat);
      const p = holder, o = ctx.other(p);
      ctx.both(q => ctx.setPanel(q, ''));
      ctx.judge(p, false);
      ctx.setFace(p,'foul'); ctx.setCaption(p,T('펑!', 'Boom!'));
      ctx.setFace(o,'win');  ctx.setCaption(o,T('한 점', 'Point!'));
      if (ctx.award(o)) return;
      timer = setTimeout(round, 1900);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); pass(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,T('준비', 'Ready')); ctx.setInfo(p,''); });
    timer = setTimeout(round, 1100);

    return function stop(){
      phase = 'idle';
      clearTimeout(timer); clearTimeout(beat);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-9. 게임 9 — 연타 대결 (분할 레이아웃)
   5초 동안 자기 쪽을 더 많이 두드린 사람이 이긴다.
   ========================================================= */
GAMES.mash = {
  get name(){ return T('연타 대결', 'Tap Race'); },
  icon: '👊',
  get desc(){ return T('5초 동안 더 많이 두드리기', 'Tap more in 5 seconds'); },
  level: 1,
  start(ctx){
    const DUR = 5000;
    let count = { A:0, B:0 }, phase = 'idle';
    let timer = null, beat = null;

    function round(){
      phase = 'ready';
      count = { A:0, B:0 };
      ctx.both(p => { ctx.setFace(p,'tense'); ctx.setPanel(p,''); ctx.setInfo(p,''); });
      let n = 3;
      ctx.both(p => ctx.setCaption(p, String(n)));
      clearInterval(beat);
      beat = setInterval(() => {
        n--;
        if (n > 0) ctx.both(p => ctx.setCaption(p, String(n)));
        else { clearInterval(beat); go(); }
      }, 700);
    }

    function go(){
      phase = 'go';
      ctx.setSignal(true);
      ctx.both(p => {
        ctx.setFace(p, null);
        ctx.setCaption(p, T('연타!', 'Tap!'));
        ctx.setPanel(p, '<div class="bignum" data-n="' + p + '">0</div>');
      });
      clearTimeout(timer);
      timer = setTimeout(done, DUR);
    }

    function hit(p){
      if (phase !== 'go') return;
      count[p]++;
      const box = ctx.half(p).querySelector('[data-n]');
      if (box) box.textContent = count[p];
    }

    function done(){
      phase = 'end';
      ctx.setSignal(false);
      ctx.both(q => ctx.setPanel(q, ''));
      const note = PN('A') + ' <b>' + count.A + '</b> · ' + PN('B') + ' <b>' + count.B + '</b>';

      if (count.A === count.B){                       // 비기면 다시 한 판
        ctx.both(q => { ctx.setFace(q,'tense'); ctx.setCaption(q,T('비겼다', 'Tie')); ctx.setInfo(q, note); });
        timer = setTimeout(round, 1900);
        return;
      }
      const p = count.A > count.B ? 'A' : 'B', o = ctx.other(p);
      ctx.judge(p, true);
      ctx.setFace(p,'win');  ctx.setCaption(p,T('한 점', 'Point!'));
      ctx.setFace(o,'lose'); ctx.setCaption(o,T('아쉽다', 'So close'));
      ctx.both(q => ctx.setInfo(q, note));
      if (ctx.award(p)) return;
      timer = setTimeout(round, 2100);
    }

    const handlers = {};
    ['A','B'].forEach(p => {
      handlers[p] = e => { e.preventDefault(); hit(p); };
      ctx.half(p).addEventListener('pointerdown', handlers[p]);
    });

    ctx.both(p => { ctx.setFace(p,'calm'); ctx.setCaption(p,T('준비', 'Ready')); ctx.setInfo(p,''); });
    timer = setTimeout(round, 1000);

    return function stop(){
      phase = 'idle';
      clearTimeout(timer); clearInterval(beat);
      ctx.setSignal(false);
      ['A','B'].forEach(p => {
        ctx.half(p).removeEventListener('pointerdown', handlers[p]);
        ctx.setPanel(p, '');
      });
    };
  }
};

/* =========================================================
   3-10. 게임 10 — 땅따먹기 (공용 판)
   점 4×4 사이에 번갈아 선을 긋는다. 네모의 네 변을 채운 사람이 그 칸을 먹고
   한 번 더 둔다. 칸이 9개(홀수)라 절대 비기지 않는다.
   점 격자는 완전 대칭이라 180도 돌려도 똑같이 보인다 — 공용 판 조건을 그냥 만족한다.
   ========================================================= */
GAMES.land = {
  get name(){ return T('땅따먹기', 'Dots and Boxes'); },
  icon: '🚩',
  get desc(){ return T('선을 이어 네모를 먹으세요', 'Draw lines, claim the boxes'); },
  level: 2,
  layout: 'shared',
  start(ctx){
    const N = 4, M = 11, S = 26;            // 점 개수 · 여백 · 간격 (viewBox 100 기준)
    const at = i => M + i * S;

    let h, v, own, turn, over, timer = null;

    function reset(){
      h   = Array.from({length:N},   () => Array(N-1).fill(''));   // 가로선
      v   = Array.from({length:N-1}, () => Array(N).fill(''));     // 세로선
      own = Array.from({length:N-1}, () => Array(N-1).fill(''));   // 칸 주인
      turn = Math.random() < 0.5 ? 'A' : 'B';
      over = false;
      draw();
      say();
    }

    function tally(){
      let a = 0, b = 0, left = 0;
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N-1; c++){
        if      (own[r][c] === 'A') a++;
        else if (own[r][c] === 'B') b++;
        else left++;
      }
      return { A:a, B:b, left:left };
    }

    function draw(){
      const cell = [], line = [], dot = [], hit = [];
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N-1; c++) if (own[r][c])
        cell.push('<rect x="' + at(c) + '" y="' + at(r) + '" width="' + S + '" height="' + S +
                  '" rx="3" fill="' + HEX[own[r][c]] + '" opacity=".45"/>');

      const add = (x1, y1, x2, y2, by, key) => {
        line.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
                  '" stroke="' + (by ? HEX[by] : '#DCDAE8') +
                  '" stroke-width="' + (by ? 3.6 : 1) + '" stroke-linecap="round"/>');
        if (!by)                              // 아직 안 그은 선만 누를 수 있다
          hit.push('<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 +
                   '" data-k="' + key + '" stroke="rgba(0,0,0,0)" stroke-width="14"' +
                   ' stroke-linecap="round"/>');
      };
      for (let r = 0; r < N;   r++) for (let c = 0; c < N-1; c++) add(at(c), at(r), at(c+1), at(r), h[r][c], 'h' + r + c);
      for (let r = 0; r < N-1; r++) for (let c = 0; c < N;   c++) add(at(c), at(r), at(c), at(r+1), v[r][c], 'v' + r + c);
      for (let r = 0; r < N;   r++) for (let c = 0; c < N;   c++)
        dot.push('<circle cx="' + at(c) + '" cy="' + at(r) + '" r="2.4" fill="#2E2B3A"/>');

      /* 칸 → 선 → 점 → 투명한 터치 영역 순. 터치 영역이 맨 위라야 손가락으로 잘 잡힌다 */
      ctx.setBoard('<svg viewBox="0 0 100 100">' +
                   cell.join('') + line.join('') + dot.join('') + hit.join('') + '</svg>', 'land');
    }

    function say(){
      const o = ctx.other(turn), t = tally();
      ctx.setFace(turn, 'alert');      ctx.setFace(o, 'calm');
      ctx.setCaption(turn, T('내 차례', 'Your turn'));  ctx.setCaption(o, T('기다리기', 'Wait'));
      /* 🚨 점수는 반드시 양쪽에 같이 적는다. 한쪽을 '' 로 비우면
         `.ms:empty{display:none}` 때문에 그 반쪽만 18px 짧아지고,
         차례가 바뀔 때마다 짧아지는 쪽이 뒤바뀌어 가운데 판이 흔들린다
         (2026-09-09 테스터 지적). */
      ctx.both(q => ctx.setInfo(q, PN('A') + ' <b>' + t.A + '</b> · ' + PN('B') + ' <b>' + t.B + '</b>'));
      /* 차례인 쪽 반쪽을 자기 색으로 물들인다 — 글자만으로는 놓쳐서
         남의 차례에 손대는 일이 있었다 */
      ctx.setTurn(turn);
      /* 지금 둘 사람 쪽만 밝게 — 판은 하나뿐이라 누가 누르든 차례인 쪽의 수로 친다 */
      ctx.lock(turn, false); ctx.lock(o, true);
    }

    function closed(r, c){ return h[r][c] && h[r+1][c] && v[r][c] && v[r][c+1]; }

    function play(p, key){
      if (over || p !== turn) return;
      const r = +key.charAt(1), c = +key.charAt(2);
      if (key.charAt(0) === 'h'){ if (h[r][c]) return; h[r][c] = p; }
      else                      { if (v[r][c]) return; v[r][c] = p; }

      let got = 0;
      for (let i = 0; i < N-1; i++) for (let j = 0; j < N-1; j++)
        if (!own[i][j] && closed(i, j)){ own[i][j] = p; got++; }

      if (got) Sound.ok(); else Sound.tick();
      if (!got) turn = ctx.other(p);          // 칸을 먹었으면 한 번 더 둔다
      draw();

      if (tally().left === 0){ end(); return; }
      say();
    }

    function end(){
      over = true;
      const t = tally(), w = t.A > t.B ? 'A' : 'B', o = ctx.other(w);
      const note = PN('A') + ' <b>' + t.A + '</b> · ' + PN('B') + ' <b>' + t.B + '</b>';
      ctx.both(q => ctx.lock(q, false));
      ctx.judge(w, true);
      ctx.setFace(w, 'win');  ctx.setCaption(w, T('더 많이 먹었다', 'More boxes'));
      ctx.setFace(o, 'lose'); ctx.setCaption(o, T('아쉽다', 'So close'));
      ctx.both(q => ctx.setInfo(q, note));
      ctx.setTurn(null);
      if (ctx.award(w)) return;
      timer = setTimeout(reset, 2400);
    }

    const onDown = e => {
      const t = e.target.closest('[data-k]');
      if (!t) return;
      e.preventDefault();
      play(turn, t.getAttribute('data-k'));   // SVG 의 dataset 은 구형에서 불안하다
    };
    ctx.board().addEventListener('pointerdown', onDown);
    reset();

    return function stop(){
      clearTimeout(timer);
      ctx.board().removeEventListener('pointerdown', onDown);
      ctx.setTurn(null);
      ctx.both(q => { ctx.lock(q, false); ctx.setInfo(q, ''); });
      ctx.setBoard('');
    };
  }
};

/* =========================================================
   4. 초기화
   ========================================================= */
(function init(){
  const list = el('#gamelist');
  function renderMenu(){
  list.innerHTML = '';

  /* 맨 위에 랜덤 — 무엇을 할지 정하는 데 시간을 쓰지 않게 한다.
     한 점이 날 때마다 다른 게임으로 갈아탄다(점수는 이어진다). */
  const rb = document.createElement('button');
  rb.className = 'gamecard rand';
  rb.type = 'button';
  rb.innerHTML = '<span class="chip" style="background:var(--go)">🎲</span>' +
                 '<span class="tx"><b>' + T('랜덤', 'Random') + '</b><span>' + T('한 점마다 다른 게임으로', 'A new game every point') + '</span></span>';
  rb.addEventListener('click', startRandom);
  list.appendChild(rb);

  Object.entries(GAMES).forEach(([key, g], i) => {
    const b = document.createElement('button');
    b.className = 'gamecard';
    const lv = g.level || 2;                       // 1 쉬움 · 2 보통 · 3 어려움
    b.innerHTML = `<span class="chip" style="background:var(--${i % 2 ? 'b' : 'a'})">${g.icon}</span>
                   <span class="tx"><b>${g.name}<span class="lv lv${lv}" aria-label="${T('난이도', 'Level')} ${LEVEL[lv]}">${LEVEL[lv]}</span></b>` +
                  `<span>${g.desc}</span></span>`;
    b.addEventListener('click', () => { randomMode = false; startGame(key); });
    list.appendChild(b);
  });
  /* 첫 화면에서 이름과 색을 묶어 준다. 이게 없으면 게임 중 "쿵 3 · 짝 2" 나
     "쿵 승리" 를 봐도 자기가 어느 쪽인지 알 길이 없다. */
  el('#who').innerHTML = `<span>${face('calm', HEX.A)}${PN('A')}</span>` +
                         `<span>${face('calm', HEX.B)}${PN('B')}</span>`;
  }
  renderMenu();
  const seg = el('#winseg');
  WIN_CHOICES.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = n;
    b.dataset.n = n;
    b.addEventListener('click', () => setWin(n));
    seg.appendChild(b);
  });
  setWin(winScore);
  flyLogo();                     // 앱을 켠 첫 화면에서도 한 번 날아온다

  el('#again').addEventListener('click', () => startGame(
    Object.keys(GAMES).find(k => GAMES[k] === current)
  ));
  el('#toMenu').addEventListener('click', () => { stopGame(); show('menu'); });

  /* 배경음악 — 끄면 그 뒤로 안 켜진다. 기기에 저장하지 않으므로 앱을 껐다 켜면
     다시 켜진 상태로 돌아온다(내기 점수와 같은 규칙). */
  /* 소리 안내 (2026-09-29 사용자 «화면을 건드려야 노래가 나온다고 안내 · 무음 모드를 끄라는 안내»)
     ① 소리가 아직 안 깨어났으면 «화면을 누르면 음악이 나와요»
     ② 깨어난 뒤 아이폰이면 «안 들리면 무음 모드를 꺼 주세요» 를 6초 — 무음 스위치는 코드로 알 수 없어서 늘 한 번 알려 준다
     안드로이드엔 무음 스위치가 없고(음악은 «미디어 음량» 을 따른다) 앱·웹 모두 ②는 아이폰에서만 */
  const tip = el('#soundTip');
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let tipTimer = 0, iosTold = false;
  let tipAct = false;   // 지금 말풍선을 누르면 «무음이어도 들리게» 가 되는가
  const tipSay = (t, act) => {
    clearTimeout(tipTimer); tipAct = !!act;
    tip.textContent = t; tip.classList.toggle('act', tipAct); tip.hidden = false;
  };
  const tipHide = () => { clearTimeout(tipTimer); tip.hidden = true; };
  function onAudio(){
    const c = Sound.ctx();
    if (!c || c.state !== 'running') return;
    tipHide();
    if (IOS && !iosTold && Music.isOn() && !Sound.isLoud()){
      iosTold = true;
      tipSay(T('🔕 무음 모드라 안 들리면 여기를 눌러 주세요', '🔕 Silent mode? Tap here to hear the music'), true);
      tipTimer = setTimeout(tipHide, 8000);
    }
  }
  if (Music.isOn()) tipSay(T('👆 화면을 누르면 음악이 나와요', '👆 Tap the screen to start the music'));
  const hookTip = () => {
    const c = Sound.ctx();
    if (c && !c.__tip){ c.__tip = 1; c.addEventListener('statechange', onAudio); }
    onAudio();
  };

  const mbtns = ['#musicBtn', '#musicA', '#musicB'].map(el);
  const syncBtns = on => mbtns.forEach(m => {
    m.classList.toggle('off', !on);
    m.setAttribute('aria-pressed', on ? 'true' : 'false');
    m.setAttribute('aria-label', on ? T('배경음악 끄기', 'Music off') : T('배경음악 켜기', 'Music on'));
  });
  /* 말풍선을 누르면 — 무음이어도 들리게 하고, 음악이 꺼져 있었으면 켠다 */
  tip.addEventListener('click', () => {
    if (!tipAct) return;
    Sound.loud(true);
    if (!Music.isOn()){ Music.toggle(); syncBtns(true); }
    tipHide();
  });
  mbtns.forEach(b => b.addEventListener('click', () => {
    const on = Music.toggle();
    Sound.loud(on);                    // 직접 켠 것 → 무음을 넘어 들리게 · 끄면 다시 무음을 따른다
    syncBtns(on);
    if (!on) tipHide(); else hookTip();
  }));
  /* 브라우저는 사람이 한 번 건드리기 전에는 소리를 못 낸다 — 첫 탭에 깨운다. */
  /* 🍎 아이폰은 pointerdown 이 아니라 손을 뗄 때(touchend·click)에만 깨워 주는 판이 있다.
     그래서 셋 다 걸어 두고, 오디오가 정말 «running» 이 된 뒤에야 떼어 낸다.
     (전에는 첫 pointerdown 에 바로 떼어서, 아이폰에서는 끝내 음악이 안 켜졌다) */
  const WAKE_EV = ['pointerdown', 'touchend', 'click'];
  const onScreen = () => el('#menu').classList.contains('on') ? 'menu'
                       : el('#arena').classList.contains('on') ? 'duel' : null;
  const wake = () => {
    Sound.unlock();
    hookTip();
    const m = onScreen(); if (m) Music.start(m);      // 아직 잠들어 있으면 Music 이 깨어나길 기다렸다 시작한다
    const c = Sound.ctx();
    if (c && c.state === 'running')                    // resume 은 비동기라 첫 탭엔 아직일 수 있다 → 다음 탭에 다시 본다
      WAKE_EV.forEach(ev => document.removeEventListener(ev, wake, true));
  };
  WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  /* 다른 앱에 갔다 오면 아이폰이 오디오를 «interrupted» 로 멈춰 둔다 → 돌아오면 다시 깨운다 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const c = Sound.ctx(); if (c && c.state !== 'running') WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  });

  /* 게임 중 나가기 — 0.7초 눌러야 열린다.
     반쪽 전체가 버저라 짧은 탭으로 나가면 실수로 대결이 날아간다.
     포인터를 캡처해 두어야 손이 버튼 밖으로 미끄러져도 취소를 놓치지 않는다. */
  const HOLD_MS = 700;
  ['A','B'].forEach(p => {
    const btn = el('#home' + p);
    let timer = null;
    const cancel = () => {
      clearTimeout(timer); timer = null;
      btn.classList.remove('holding');
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch(_){}
      btn.classList.add('holding');
      timer = setTimeout(() => {
        cancel();
        stopGame();
        show('menu');
      }, HOLD_MS);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev =>
      btn.addEventListener(ev, cancel));
  });

  /* 「English / 한국어」 — 화면에 박힌 글은 data-i18n, 섞인 것(설명·글꼴 정보)은 통째로 바꾼다 */
  const EN = {
    rotB: 'Please hold your phone upright', rotP: 'Tap Pals works in portrait only',
    sub: 'Two players, one phone', win: 'Play to', share: 'Recommend to a friend',
    font: 'Font info', again: 'Rematch', toMenu: 'Pick a game'
  };
  const KO = {};
  document.querySelectorAll('[data-i18n]').forEach(n => { KO[n.dataset.i18n] = n.textContent; });
  const hint = el('#hint'), fontBox = el('#fontBox');
  const KO_HINT = hint.innerHTML, KO_FONT = fontBox.innerHTML;
  const homeSvg = hint.querySelector('svg').outerHTML;
  const EN_HINT = 'Put the phone between you and sit face to face.<br>' +
    'First to <b id="winNum">10</b> points wins.<br>' +
    'To leave a match, press and hold the ' + homeSvg + ' in the corner.';
  const EN_FONT = '<b class="t">Font info</b>' +
    'All fonts in Tap Pals are free fonts released under the SIL Open Font License 1.1.<br>' +
    '· Jua - titles<br>· Gowun Dodum - body text<br>· Gothic A1 Medium - bold text<br>' +
    'Full license: openfontlicense.org' +
    '<button class="btn primary" id="fontClose" type="button">Close</button>';
  const bindClose = () => el('#fontClose').addEventListener('click', () => { el('#fontinfo').hidden = true; });
  bindClose();
  window.applyLang = () => {
    document.documentElement.lang = LANG;
    document.title = T('쿵짝', 'Tap Pals');
    /* 로고 — 영어는 «Tap Pals»(2026-10-03 사용자 3-1). 두 덩이가 굴러와 박히는 움직임은 그대로 */
    el('#logo .ku').textContent = T('쿵', 'Tap');
    el('#logo .jjak').textContent = T('짝', 'Pals');
    el('#logo').classList.toggle('en', LANG === 'en');
    el('#logo').setAttribute('aria-label', T('쿵짝', 'Tap Pals'));
    document.querySelectorAll('[data-i18n]').forEach(n => {
      const k = n.dataset.i18n; n.textContent = LANG === 'en' ? EN[k] : KO[k];
    });
    hint.innerHTML = LANG === 'en' ? EN_HINT : KO_HINT;
    fontBox.innerHTML = LANG === 'en' ? EN_FONT : KO_FONT;
    bindClose();
    const lb = el('#langBtn');
    lb.textContent = LANG === 'en' ? '한국어' : 'English';
    lb.lang = LANG === 'en' ? 'ko' : 'en';
    ['#homeA', '#homeB'].forEach(s => el(s).setAttribute('aria-label',
      T('메뉴로 나가기 (길게 누르기)', 'Back to menu (press and hold)')));
    syncBtns(Music.isOn());
    if (!tip.hidden) tipHide();
    renderMenu();
    setWin(winScore);                // #winNum 을 다시 채운다
  };
  el('#langBtn').addEventListener('click', () => { LANG = LANG === 'en' ? 'ko' : 'en'; applyLang(); });
  if (LANG !== 'ko') applyLang();

  drawPips();
})();

/* 서비스워커 — 사파리에서 홈 화면에 추가했을 때 오프라인으로 돌게 한다.
   Flutter WebView는 file:// 로 뜨므로 자동으로 건너뛴다. */
/* 설치한 앱(PWA)·전체화면에서는 방향을 세로로 묶어 본다. 안 되는 브라우저는 조용히 넘어가고 위 #rotate 가 맡는다 */
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* 친구에게 추천하기 · 글꼴 정보 (2026-10-03) */
(function(){
  var toastEl=document.getElementById('toast'),tt=0;
  function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toastEl.hidden=true},2200)}
  var LINKS='\nhttps://sya-apps.github.io/kungjjak/\nhttps://play.google.com/store/apps/details?id=com.syaapps.kungjjak';
  /* 누를 때 언어를 본다 — 영어 화면이면 영어 한 줄로 보낸다 */
  function text(){return T('쿵짝 - 둘이서 하는 2인용 미니게임','Tap Pals - mini games for two on one phone')+LINKS}
  function copy(){
    function legacy(){
      try{var t=document.createElement('textarea');t.value=text();t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
        var ok=document.execCommand('copy');document.body.removeChild(t);toast(ok?T('복사했어요','Copied'):T('복사하지 못했어요','Could not copy'))}catch(e){toast(T('복사하지 못했어요','Could not copy'))}
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text()).then(function(){toast(T('복사했어요','Copied'))},legacy)}else legacy();
  }
  document.getElementById('shareBtn').addEventListener('click',function(){
    if(window.KungShare&&window.KungShare.postMessage){try{window.KungShare.postMessage(text());return}catch(e){}}
    if(navigator.share){navigator.share({title:T('쿵짝','Tap Pals'),text:text()}).catch(function(e){if(e&&e.name!=='AbortError')copy()});return}
    copy();
  });
  var fi=document.getElementById('fontinfo');
  document.getElementById('fontLink').addEventListener('click',function(){fi.hidden=false});
  fi.addEventListener('click',function(e){if(e.target===fi)fi.hidden=true});
})();
</script>
