    b.type = 'button';
    b.textContent = n;
    b.dataset.n = n;
    b.addEventListener('click', () => setWin(n));
    seg.appendChild(b);
  });
  /* 첫 화면에서 이름과 색을 묶어 준다. 이게 없으면 게임 중 "쿵 3 · 짝 2" 나
     "쿵 승리" 를 봐도 자기가 어느 쪽인지 알 길이 없다. */
  el('#who').innerHTML = `<span>${face('calm', HEX.A)}쿵</span>` +
                         `<span>${face('calm', HEX.B)}짝</span>`;

  setWin(winScore);
  flyLogo();                     // 앱을 켠 첫 화면에서도 한 번 날아온다

  el('#again').addEventListener('click', () => startGame(
    Object.keys(GAMES).find(k => GAMES[k] === current)
  ));
  el('#toMenu').addEventListener('click', () => { stopGame(); show('menu'); });

  /* 배경음악 — 끄면 그 뒤로 안 켜진다. 기기에 저장하지 않으므로 앱을 껐다 켜면
     다시 켜진 상태로 돌아온다(내기 점수와 같은 규칙). */
  /* 소리 안내 (2026-09-29 사용자 «화면을 건드려야 노래가 나온다고 안내 · 무음 모드를 끄라는 안내»)
     ① 소리가 아직 안 깨어났으면 «화면을 누르면 음악이 나와요»
     ② 깨어난 뒤 아이폰이면 «안 들리면 무음 모드를 꺼 주세요» 를 6초 — 무음 스위치는 코드로 알 수 없어서 늘 한 번 알려 준다
     안드로이드엔 무음 스위치가 없고(음악은 «미디어 음량» 을 따른다) 앱·웹 모두 ②는 아이폰에서만 */
  const tip = el('#soundTip');
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let tipTimer = 0, iosTold = false;
  let tipAct = false;   // 지금 말풍선을 누르면 «무음이어도 들리게» 가 되는가
  const tipSay = (t, act) => {
    clearTimeout(tipTimer); tipAct = !!act;
    tip.textContent = t; tip.classList.toggle('act', tipAct); tip.hidden = false;
  };
  const tipHide = () => { clearTimeout(tipTimer); tip.hidden = true; };
  function onAudio(){
    const c = Sound.ctx();
    if (!c || c.state !== 'running') return;
    tipHide();
    if (IOS && !iosTold && Music.isOn() && !Sound.isLoud()){
      iosTold = true;
      tipSay('🔕 무음 모드라 안 들리면 여기를 눌러 주세요', true);
      tipTimer = setTimeout(tipHide, 8000);
    }
  }
  if (Music.isOn()) tipSay('👆 화면을 누르면 음악이 나와요');
  const hookTip = () => {
    const c = Sound.ctx();
    if (c && !c.__tip){ c.__tip = 1; c.addEventListener('statechange', onAudio); }
    onAudio();
  };

  const mbtns = ['#musicBtn', '#musicA', '#musicB'].map(el);
  const syncBtns = on => mbtns.forEach(m => {
    m.classList.toggle('off', !on);
    m.setAttribute('aria-pressed', on ? 'true' : 'false');
    m.setAttribute('aria-label', on ? '배경음악 끄기' : '배경음악 켜기');
  });
  /* 말풍선을 누르면 — 무음이어도 들리게 하고, 음악이 꺼져 있었으면 켠다 */
  tip.addEventListener('click', () => {
    if (!tipAct) return;
    Sound.loud(true);
    if (!Music.isOn()){ Music.toggle(); syncBtns(true); }
    tipHide();
  });
  mbtns.forEach(b => b.addEventListener('click', () => {
    const on = Music.toggle();
    Sound.loud(on);                    // 직접 켠 것 → 무음을 넘어 들리게 · 끄면 다시 무음을 따른다
    syncBtns(on);
    if (!on) tipHide(); else hookTip();
  }));
  /* 브라우저는 사람이 한 번 건드리기 전에는 소리를 못 낸다 — 첫 탭에 깨운다. */
  /* 🍎 아이폰은 pointerdown 이 아니라 손을 뗄 때(touchend·click)에만 깨워 주는 판이 있다.
     그래서 셋 다 걸어 두고, 오디오가 정말 «running» 이 된 뒤에야 떼어 낸다.
     (전에는 첫 pointerdown 에 바로 떼어서, 아이폰에서는 끝내 음악이 안 켜졌다) */
  const WAKE_EV = ['pointerdown', 'touchend', 'click'];
  const onScreen = () => el('#menu').classList.contains('on') ? 'menu'
                       : el('#arena').classList.contains('on') ? 'duel' : null;
  const wake = () => {
    Sound.unlock();
    hookTip();
    const m = onScreen(); if (m) Music.start(m);      // 아직 잠들어 있으면 Music 이 깨어나길 기다렸다 시작한다
    const c = Sound.ctx();
    if (c && c.state === 'running')                    // resume 은 비동기라 첫 탭엔 아직일 수 있다 → 다음 탭에 다시 본다
      WAKE_EV.forEach(ev => document.removeEventListener(ev, wake, true));
  };
  WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  /* 다른 앱에 갔다 오면 아이폰이 오디오를 «interrupted» 로 멈춰 둔다 → 돌아오면 다시 깨운다 */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    const c = Sound.ctx(); if (c && c.state !== 'running') WAKE_EV.forEach(ev => document.addEventListener(ev, wake, true));
  });

  /* 게임 중 나가기 — 0.7초 눌러야 열린다.
     반쪽 전체가 버저라 짧은 탭으로 나가면 실수로 대결이 날아간다.
     포인터를 캡처해 두어야 손이 버튼 밖으로 미끄러져도 취소를 놓치지 않는다. */
  const HOLD_MS = 700;
  ['A','B'].forEach(p => {
    const btn = el('#home' + p);
    let timer = null;
    const cancel = () => {
      clearTimeout(timer); timer = null;
      btn.classList.remove('holding');
    };
    btn.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch(_){}
      btn.classList.add('holding');
      timer = setTimeout(() => {
        cancel();
        stopGame();
        show('menu');
      }, HOLD_MS);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev =>
      btn.addEventListener(ev, cancel));
  });

  drawPips();
})();

/* 서비스워커 — 사파리에서 홈 화면에 추가했을 때 오프라인으로 돌게 한다.
   Flutter WebView는 file:// 로 뜨므로 자동으로 건너뛴다. */
/* 설치한 앱(PWA)·전체화면에서는 방향을 세로로 묶어 본다. 안 되는 브라우저는 조용히 넘어가고 위 #rotate 가 맡는다 */
try { screen.orientation?.lock?.('portrait').catch(() => {}); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* 친구에게 추천하기 · 글꼴 정보 (2026-10-03) */
(function(){
  var toastEl=document.getElementById('toast'),tt=0;
  function toast(m){toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(function(){toastEl.hidden=true},2200)}
  var TEXT='쿵짝 - 둘이서 하는 2인용 미니게임\nhttps://sya-apps.github.io/kungjjak/\nhttps://play.google.com/store/apps/details?id=com.syaapps.kungjjak';
  function copy(){
    function legacy(){
      try{var t=document.createElement('textarea');t.value=TEXT;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();
        var ok=document.execCommand('copy');document.body.removeChild(t);toast(ok?'복사했어요':'복사하지 못했어요')}catch(e){toast('복사하지 못했어요')}
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(TEXT).then(function(){toast('복사했어요')},legacy)}else legacy();
  }
  document.getElementById('shareBtn').addEventListener('click',function(){
    if(window.KungShare&&window.KungShare.postMessage){try{window.KungShare.postMessage(TEXT);return}catch(e){}}
    if(navigator.share){navigator.share({title:'쿵짝',text:TEXT}).catch(function(e){if(e&&e.name!=='AbortError')copy()});return}
    copy();
  });
  var fi=document.getElementById('fontinfo');
  document.getElementById('fontLink').addEventListener('click',function(){fi.hidden=false});
  document.getElementById('fontClose').addEventListener('click',function(){fi.hidden=true});
  fi.addEventListener('click',function(e){if(e.target===fi)fi.hidden=true});
})();
</script>
